<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Área ADM — Superville</title>
<style>
  :root{
    --ink: #1c2438;
    --ink-soft: #4a5474;
    --paper: #eef0f4;
    --paper-line: #d7dbe4;
    --card: #ffffff;
    --navy: #1f6b45;
    --navy-deep: #14432c;
    --steel: #5b6b8c;
    --amber: #c47f2c;
    --amber-bg: #fbf1e2;
    --red: #a8342a;
    --red-bg: #fbe9e6;
    --green: #2f6b4f;
    --green-bg: #e7f2ec;
    --mono: 'Courier New', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:var(--sans);
    background:
      repeating-linear-gradient(var(--paper), var(--paper) 27px, var(--paper-line) 28px),
      var(--paper);
    color:var(--ink);
    min-height:100vh;
    padding-bottom:60px;
  }
  header{
    background:var(--navy);
    color:#fff;
    padding:22px 24px 20px;
    border-bottom:6px solid var(--navy-deep);
  }
  header h1{margin:0;font-size:1.4rem;letter-spacing:.03em;font-family:var(--mono);font-weight:700;}
  header p{margin:6px 0 0;color:#c3cbe0;font-size:.85rem;}
  .brand{display:flex;align-items:center;gap:14px;}
  .brand-logo{width:52px;height:52px;border-radius:12px;object-fit:cover;flex-shrink:0;}
  .tabs{max-width:960px;margin:18px auto 0;padding:0 16px;display:flex;gap:6px;flex-wrap:wrap;}
  .tab{padding:10px 16px;background:transparent;border:none;border-bottom:3px solid transparent;font-family:var(--sans);font-weight:600;font-size:.88rem;color:var(--ink-soft);cursor:pointer;}
  .tab.active{color:var(--navy);border-bottom-color:var(--amber);}
  .tab-nav{text-decoration:none;display:inline-block;}
  main{max-width:960px;margin:14px auto 0;padding:0 16px;}
  .panel{display:none;}
  .panel.active{display:block;}
  .card{background:var(--card);border:1px solid var(--paper-line);border-radius:10px;padding:22px;box-shadow:0 1px 2px rgba(23,32,58,.05);}
  .card + .card{margin-top:14px;}
  h2{font-size:1rem;margin:0 0 16px;color:var(--navy);font-family:var(--mono);}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media (max-width:560px){ .grid{grid-template-columns:1fr;} }
  label{display:block;font-size:.75rem;font-weight:600;color:var(--ink-soft);margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em;}
  input, select{width:100%;padding:9px 10px;border:1px solid var(--paper-line);border-radius:6px;font-size:.92rem;font-family:var(--sans);color:var(--ink);background:#fff;}
  input:focus, select:focus{outline:2px solid var(--amber);outline-offset:1px;}
  .field{margin-bottom:2px;}
  .actions{margin-top:20px;display:flex;justify-content:flex-end;gap:10px;}
  button.primary{background:var(--navy);color:#fff;border:none;padding:11px 22px;border-radius:6px;font-weight:600;font-size:.88rem;cursor:pointer;}
  button.primary:hover{background:var(--navy-deep);}
  button.secondary{background:#fff;color:var(--navy);border:1px solid var(--navy);padding:8px 14px;border-radius:6px;font-weight:600;font-size:.8rem;cursor:pointer;}
  button.danger{background:#fff;color:var(--red);border:1px solid var(--red);padding:8px 14px;border-radius:6px;font-weight:600;font-size:.8rem;cursor:pointer;}
  button.danger:hover{background:var(--red-bg);}
  .empty{text-align:center;color:var(--ink-soft);padding:36px 10px;font-size:.9rem;}
  .row{border:1px solid var(--paper-line);border-radius:8px;padding:14px 16px;display:flex;justify-content:space-between;gap:14px;align-items:center;background:#fff;flex-wrap:wrap;}
  .row + .row{margin-top:10px;}
  .row-info b{font-size:1rem;color:var(--navy);}
  .row-meta{font-size:.8rem;color:var(--ink-soft);margin-top:4px;line-height:1.5;}
  .row-actions{display:flex;gap:8px;}
  .stamp{font-family:var(--mono);font-size:.68rem;font-weight:700;letter-spacing:.06em;padding:4px 9px;border-radius:4px;border:2px solid currentColor;display:inline-block;transform:rotate(-2deg);white-space:nowrap;}
  .stamp.ok{color:var(--green);background:var(--green-bg);}
  .stamp.warn{color:var(--amber);background:var(--amber-bg);}
  .stamp.late{color:var(--red);background:var(--red-bg);}
  table{width:100%;border-collapse:collapse;font-size:.82rem;}
  th{text-align:left;font-family:var(--mono);font-size:.68rem;text-transform:uppercase;color:var(--ink-soft);padding:8px 8px;border-bottom:2px solid var(--paper-line);}
  td{padding:9px 8px;border-bottom:1px solid var(--paper-line);vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy-deep);color:#fff;padding:11px 20px;border-radius:8px;font-size:.85rem;opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
  .hint{font-size:.72rem;color:var(--ink-soft);margin-top:4px;}

  /* LOGIN */
  #login-screen{
    max-width:380px;
    margin:80px auto;
    padding:0 16px;
  }
  #login-screen .card{text-align:left;}
  #login-screen h2{text-align:center;font-size:1.1rem;}
  .erro-login{color:var(--red);font-size:.8rem;margin-top:10px;text-align:center;display:none;}
</style>
</head>
<body>

<div id="login-screen">
  <div class="card">
    <div class="brand" style="justify-content:center;margin-bottom:18px;">
      <img class="brand-logo" src="" id="login-logo" alt="Superville Supermercado">
    </div>
    <h2>ÁREA ADMINISTRATIVA</h2>
    <form id="form-login">
      <div class="field" style="margin-bottom:14px;">
        <label for="login-usuario">Usuário</label>
        <input id="login-usuario" required placeholder="Seu nome de usuário">
      </div>
      <div class="field">
        <label for="login-senha">Senha</label>
        <input id="login-senha" type="password" required placeholder="Senha">
      </div>
      <div class="actions" style="justify-content:center;">
        <button type="submit" class="primary" style="width:100%;">Entrar</button>
      </div>
      <p class="erro-login" id="erro-login">Usuário ou senha incorretos.</p>
    </form>
  </div>
</div>

<div id="app-admin" style="display:none;">
  <header>
    <div class="brand">
      <img class="brand-logo" src="" id="header-logo" alt="Superville Supermercado">
      <div>
        <h1>⚙️ ÁREA ADMINISTRATIVA</h1>
        <p>Logado como <b id="usuario-logado"></b></p>
      </div>
    </div>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="chaves">Solicitações de Chaves</button>
    <button class="tab" data-tab="funcionarios">Solicitações de Funcionários</button>
    <button class="tab" data-tab="estatisticas">Estatísticas de Café</button>
    <a href="controle-chaves.html" class="tab tab-nav">🔑 Chaves</a>
    <a href="controle-cafe.html" class="tab tab-nav">☕ Café</a>
    <button class="tab tab-nav" id="btn-sair" style="margin-left:auto;">Sair</button>
  </div>

  <main>

    <!-- CHAVES -->
    <div class="panel active" id="panel-chaves">
      <div class="card">
        <h2>SOLICITAÇÕES DE CADASTRO PENDENTES</h2>
        <div id="lista-solicitacoes-chaves"></div>
      </div>

      <div class="card">
        <h2>ADICIONAR CHAVE DIRETAMENTE</h2>
        <form id="form-add-chave">
          <div class="grid">
            <div class="field">
              <label for="add-chave-numero">Número</label>
              <input id="add-chave-numero" required placeholder="Ex: 066">
            </div>
            <div class="field">
              <label for="add-chave-nome">Nome da chave</label>
              <input id="add-chave-nome" required placeholder="Ex: Chave do freezer novo">
            </div>
          </div>
          <div class="actions">
            <button type="submit" class="primary">Adicionar</button>
          </div>
        </form>
      </div>

      <div class="card">
        <h2>CHAVES CADASTRADAS</h2>
        <div id="lista-chaves-cadastradas"></div>
      </div>
    </div>

    <!-- FUNCIONARIOS -->
    <div class="panel" id="panel-funcionarios">
      <div class="card">
        <h2>SOLICITAÇÕES DE EXCLUSÃO PENDENTES</h2>
        <div id="lista-solicitacoes-func"></div>
      </div>

      <div class="card">
        <h2>FUNCIONÁRIOS CADASTRADOS</h2>
        <div id="lista-funcionarios-adm"></div>
      </div>
    </div>

    <!-- ESTATISTICAS -->
    <div class="panel" id="panel-estatisticas">
      <div class="card">
        <h2>RANKING DE ATRASOS</h2>
        <div id="ranking-atrasos"></div>
      </div>
      <div class="card">
        <h2>TODAS AS RODADAS DE CAFÉ</h2>
        <div id="todas-sessoes"></div>
      </div>
    </div>

  </main>
</div>

<div class="toast" id="toast"></div>

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s ?? '';
  return d.innerHTML;
}
function fmtHora(iso){ if(!iso) return '—'; return new Date(iso).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
function fmtDataHora(iso){ if(!iso) return '—'; return new Date(iso).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}); }
function mostrarToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2400);
}

// ---------- LOGIN ----------
document.getElementById('form-login').addEventListener('submit', (e)=>{
  e.preventDefault();
  const usuario = document.getElementById('login-usuario').value.trim();
  const senha = document.getElementById('login-senha').value;
  const encontrado = USUARIOS_ADM.find(u=> u.usuario.toLowerCase() === usuario.toLowerCase() && u.senha === senha);
  if(!encontrado){
    document.getElementById('erro-login').style.display = 'block';
    return;
  }
  document.getElementById('erro-login').style.display = 'none';
  sessionStorage.setItem('adm-usuario', encontrado.usuario);
  entrarNoPainel(encontrado.usuario);
});

document.getElementById('btn-sair').addEventListener('click', ()=>{
  sessionStorage.removeItem('adm-usuario');
  location.reload();
});

function entrarNoPainel(usuario){
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-admin').style.display = 'block';
  document.getElementById('usuario-logado').textContent = usuario;
  iniciarListeners();
}

const usuarioSalvo = sessionStorage.getItem('adm-usuario');
if(usuarioSalvo && USUARIOS_ADM.some(u=>u.usuario === usuarioSalvo)){
  entrarNoPainel(usuarioSalvo);
}

// ---------- TABS ----------
document.querySelectorAll('.tab:not(.tab-nav)').forEach(btn=>{
  if(btn.id === 'btn-sair') return;
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab:not(.tab-nav)').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
  });
});

// ---------- DADOS ----------
let solicitacoesChaves = [];
let chavesCadastradas = [];
let solicitacoesFunc = [];
let funcionarios = [];
let sessoesCafe = [];

function iniciarListeners(){
  db.collection('chaves_solicitacoes').where('status','==','pendente').onSnapshot(snap=>{
    solicitacoesChaves = snap.docs.map(d=>({id:d.id, ...d.data()}));
    renderSolicitacoesChaves();
  });
  db.collection('chaves_cadastradas').orderBy('numero').onSnapshot(snap=>{
    chavesCadastradas = snap.docs.map(d=>({id:d.id, ...d.data()}));
    renderChavesCadastradas();
  });
  db.collection('cafe_solicitacoes_exclusao').where('status','==','pendente').onSnapshot(snap=>{
    solicitacoesFunc = snap.docs.map(d=>({id:d.id, ...d.data()}));
    renderSolicitacoesFunc();
  });
  db.collection('cafe_funcionarios').orderBy('nome').onSnapshot(snap=>{
    funcionarios = snap.docs.map(d=>({id:d.id, ...d.data()}));
    renderFuncionariosAdm();
  });
  db.collection('cafe_sessoes').orderBy('inicioSessao','desc').onSnapshot(snap=>{
    sessoesCafe = snap.docs.map(d=>d.data());
    renderEstatisticas();
  });
}

// ---------- CHAVES: SOLICITAÇÕES ----------
function renderSolicitacoesChaves(){
  const el = document.getElementById('lista-solicitacoes-chaves');
  if(solicitacoesChaves.length === 0){
    el.innerHTML = '<div class="empty">Nenhuma solicitação pendente.</div>';
    return;
  }
  el.innerHTML = solicitacoesChaves.map(s=>`
    <div class="row">
      <div class="row-info">
        <b>${escapeHtml(s.numero)} — ${escapeHtml(s.nome)}</b>
        <div class="row-meta">Solicitado em ${fmtDataHora(s.dataSolicitacao)}</div>
      </div>
      <div class="row-actions">
        <button class="secondary btn-aprovar-chave" data-id="${s.id}" data-numero="${escapeHtml(s.numero)}" data-nome="${escapeHtml(s.nome)}">Aprovar</button>
        <button class="danger btn-rejeitar-chave" data-id="${s.id}">Rejeitar</button>
      </div>
    </div>
  `).join('');

  el.querySelectorAll('.btn-aprovar-chave').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      try{
        await db.collection('chaves_cadastradas').doc(btn.dataset.numero).set({numero: btn.dataset.numero, nome: btn.dataset.nome});
        await db.collection('chaves_solicitacoes').doc(btn.dataset.id).update({status:'aprovado'});
        mostrarToast('Chave aprovada e cadastrada.');
      }catch(err){ mostrarToast('Erro ao aprovar.'); }
    });
  });
  el.querySelectorAll('.btn-rejeitar-chave').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      try{
        await db.collection('chaves_solicitacoes').doc(btn.dataset.id).update({status:'rejeitado'});
        mostrarToast('Solicitação rejeitada.');
      }catch(err){ mostrarToast('Erro ao rejeitar.'); }
    });
  });
}

// ---------- CHAVES: ADICIONAR DIRETO ----------
document.getElementById('form-add-chave').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const numero = document.getElementById('add-chave-numero').value.trim();
  const nome = document.getElementById('add-chave-nome').value.trim();
  if(!numero || !nome) return;
  try{
    await db.collection('chaves_cadastradas').doc(numero).set({numero, nome});
    e.target.reset();
    mostrarToast('Chave adicionada: ' + numero);
  }catch(err){ mostrarToast('Erro ao adicionar chave.'); }
});

// ---------- CHAVES: LISTA COM EXCLUSÃO ----------
function renderChavesCadastradas(){
  const el = document.getElementById('lista-chaves-cadastradas');
  if(chavesCadastradas.length === 0){
    el.innerHTML = '<div class="empty">Nenhuma chave cadastrada.</div>';
    return;
  }
  el.innerHTML = chavesCadastradas.map(c=>`
    <div class="row">
      <div class="row-info"><b>${escapeHtml(c.numero)} — ${escapeHtml(c.nome)}</b></div>
      <button class="danger btn-excluir-chave" data-numero="${escapeHtml(c.numero)}" data-nome="${escapeHtml(c.nome)}">Excluir</button>
    </div>
  `).join('');

  el.querySelectorAll('.btn-excluir-chave').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm('Excluir a chave ' + btn.dataset.numero + ' — ' + btn.dataset.nome + '?')) return;
      try{
        await db.collection('chaves_cadastradas').doc(btn.dataset.numero).delete();
        mostrarToast('Chave excluída.');
      }catch(err){ mostrarToast('Erro ao excluir.'); }
    });
  });
}

// ---------- FUNCIONARIOS: SOLICITAÇÕES DE EXCLUSÃO ----------
function renderSolicitacoesFunc(){
  const el = document.getElementById('lista-solicitacoes-func');
  if(solicitacoesFunc.length === 0){
    el.innerHTML = '<div class="empty">Nenhuma solicitação pendente.</div>';
    return;
  }
  el.innerHTML = solicitacoesFunc.map(s=>`
    <div class="row">
      <div class="row-info">
        <b>${escapeHtml(s.nome)}</b>
        <div class="row-meta">${escapeHtml(s.setor)} · solicitado em ${fmtDataHora(s.dataSolicitacao)}</div>
      </div>
      <div class="row-actions">
        <button class="danger btn-aprovar-exclusao" data-id="${s.id}" data-funcid="${s.funcionarioId}">Aprovar exclusão</button>
        <button class="secondary btn-rejeitar-exclusao" data-id="${s.id}">Rejeitar</button>
      </div>
    </div>
  `).join('');

  el.querySelectorAll('.btn-aprovar-exclusao').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      try{
        await db.collection('cafe_funcionarios').doc(btn.dataset.funcid).delete();
        await db.collection('cafe_solicitacoes_exclusao').doc(btn.dataset.id).update({status:'aprovado'});
        mostrarToast('Funcionário(a) excluído(a).');
      }catch(err){ mostrarToast('Erro ao excluir.'); }
    });
  });
  el.querySelectorAll('.btn-rejeitar-exclusao').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      try{
        await db.collection('cafe_solicitacoes_exclusao').doc(btn.dataset.id).update({status:'rejeitado'});
        mostrarToast('Solicitação rejeitada.');
      }catch(err){ mostrarToast('Erro ao rejeitar.'); }
    });
  });
}

}

// ---------- ESTATISTICAS ----------
function renderEstatisticas(){
  const finalizadas = sessoesCafe.filter(s=>!s.ativa);

  const ranking = {};
  finalizadas.forEach(s=>{
    (s.participantes||[]).forEach(p=>{
      if(!ranking[p.nome]) ranking[p.nome] = {nome:p.nome, setor:p.setor, total:0, atrasos:0, motivos:[]};
      ranking[p.nome].total++;
      if(p.atrasado){
        ranking[p.nome].atrasos++;
        if(p.observacao) ranking[p.nome].motivos.push(p.observacao);
      }
    });
  });
  const rankingLista = Object.values(ranking).sort((a,b)=> b.atrasos - a.atrasos);

  document.getElementById('ranking-atrasos').innerHTML = `
    <table>
      <thead><tr><th>Nome</th><th>Setor</th><th>Cafés</th><th>Atrasos</th><th>Motivos</th></tr></thead>
      <tbody>
        ${rankingLista.map(r=>`
          <tr>
            <td><strong>${escapeHtml(r.nome)}</strong></td>
            <td>${escapeHtml(r.setor)}</td>
            <td>${r.total}</td>
            <td>${r.atrasos > 0 ? '<span class="stamp late">'+r.atrasos+'</span>' : r.atrasos}</td>
            <td>${r.motivos.length ? escapeHtml(r.motivos.join(' · ')) : '—'}</td>
          </tr>
        `).join('') || '<tr><td colspan="5" style="text-align:center;color:var(--ink-soft);">Nenhum dado ainda.</td></tr>'}
      </tbody>
    </table>
  `;

  document.getElementById('todas-sessoes').innerHTML = `
    <table>
      <thead><tr><th>Data</th><th>Início</th><th>Término</th><th>Colaboradores</th><th>Atrasos</th></tr></thead>
      <tbody>
        ${finalizadas.map(s=>{
          const atrasos = (s.participantes||[]).filter(p=>p.atrasado).length;
          return `<tr>
            <td>${new Date(s.inicioSessao).toLocaleDateString('pt-BR')}</td>
            <td>${fmtHora(s.inicioSessao)}</td>
            <td>${fmtHora(s.fimSessao)}</td>
            <td>${(s.participantes||[]).length}</td>
            <td>${atrasos > 0 ? '<span class="stamp late">'+atrasos+'</span>' : atrasos}</td>
          </tr>`;
        }).join('') || '<tr><td colspan="5" style="text-align:center;color:var(--ink-soft);">Nenhuma rodada finalizada ainda.</td></tr>'}
      </tbody>
    </table>
  `;
}
</script>
