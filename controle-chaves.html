<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Chaves — Balcão de Atendimento</title>
<style>
  :root{
    --ink: #1c2438;
    --ink-soft: #4a5474;
    --paper: #eef0f4;
    --paper-line: #d7dbe4;
    --card: #ffffff;
    --navy: #22304f;
    --navy-deep: #17203a;
    --steel: #5b6b8c;
    --amber: #c47f2c;
    --amber-bg: #fbf1e2;
    --red: #a8342a;
    --red-bg: #fbe9e6;
    --green: #2f6b4f;
    --green-bg: #e7f2ec;
    --mono: 'Courier New', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:var(--sans);
    background:
      repeating-linear-gradient(var(--paper), var(--paper) 27px, var(--paper-line) 28px),
      var(--paper);
    color:var(--ink);
    min-height:100vh;
    padding-bottom:60px;
  }
  header{
    background:var(--navy);
    color:#fff;
    padding:22px 24px 20px;
    border-bottom:6px solid var(--navy-deep);
  }
  header h1{
    margin:0;
    font-size:1.4rem;
    letter-spacing:.03em;
    font-family:var(--mono);
    font-weight:700;
  }
  header p{
    margin:6px 0 0;
    color:#c3cbe0;
    font-size:.85rem;
  }
  .summary{
    display:flex;
    gap:10px;
    max-width:920px;
    margin:16px auto 0;
    padding:0 16px;
    flex-wrap:wrap;
  }
  .pill{
    background:var(--card);
    border:1px solid var(--paper-line);
    border-radius:8px;
    padding:10px 16px;
    font-size:.8rem;
    color:var(--ink-soft);
    display:flex;
    gap:8px;
    align-items:baseline;
  }
  .pill b{font-size:1.15rem;color:var(--navy);font-family:var(--mono);}
  .pill.warn b{color:var(--red);}
  .tabs{
    max-width:920px;
    margin:18px auto 0;
    padding:0 16px;
    display:flex;
    gap:6px;
  }
  .tab{
    padding:10px 16px;
    background:transparent;
    border:none;
    border-bottom:3px solid transparent;
    font-family:var(--sans);
    font-weight:600;
    font-size:.88rem;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .tab.active{color:var(--navy);border-bottom-color:var(--amber);}
  main{
    max-width:920px;
    margin:14px auto 0;
    padding:0 16px;
  }
  .panel{display:none;}
  .panel.active{display:block;}
  .card{
    background:var(--card);
    border:1px solid var(--paper-line);
    border-radius:10px;
    padding:22px;
    box-shadow:0 1px 2px rgba(23,32,58,.05);
  }
  .card + .card{margin-top:14px;}
  h2{
    font-size:1rem;
    margin:0 0 16px;
    color:var(--navy);
    font-family:var(--mono);
  }
  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  @media (max-width:560px){ .grid{grid-template-columns:1fr;} }
  label{
    display:block;
    font-size:.75rem;
    font-weight:600;
    color:var(--ink-soft);
    margin-bottom:5px;
    text-transform:uppercase;
    letter-spacing:.03em;
  }
  input, select{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--paper-line);
    border-radius:6px;
    font-size:.92rem;
    font-family:var(--sans);
    color:var(--ink);
    background:#fff;
  }
  input:focus, select:focus{outline:2px solid var(--amber);outline-offset:1px;}
  .field{margin-bottom:2px;}
  .actions{
    margin-top:20px;
    display:flex;
    justify-content:flex-end;
  }
  button.primary{
    background:var(--navy);
    color:#fff;
    border:none;
    padding:11px 22px;
    border-radius:6px;
    font-weight:600;
    font-size:.88rem;
    cursor:pointer;
  }
  button.primary:hover{background:var(--navy-deep);}
  button.secondary{
    background:#fff;
    color:var(--navy);
    border:1px solid var(--navy);
    padding:8px 14px;
    border-radius:6px;
    font-weight:600;
    font-size:.8rem;
    cursor:pointer;
  }
  .empty{
    text-align:center;
    color:var(--ink-soft);
    padding:36px 10px;
    font-size:.9rem;
  }
  .row{
    border:1px solid var(--paper-line);
    border-radius:8px;
    padding:14px 16px;
    display:flex;
    justify-content:space-between;
    gap:14px;
    align-items:center;
    background:#fff;
  }
  .row + .row{margin-top:10px;}
  .row-info b{font-size:1rem;color:var(--navy);}
  .row-meta{font-size:.8rem;color:var(--ink-soft);margin-top:4px;line-height:1.5;}
  .stamp{
    font-family:var(--mono);
    font-size:.68rem;
    font-weight:700;
    letter-spacing:.06em;
    padding:4px 9px;
    border-radius:4px;
    border:2px solid currentColor;
    display:inline-block;
    transform:rotate(-2deg);
    white-space:nowrap;
  }
  .stamp.ok{color:var(--green);background:var(--green-bg);}
  .stamp.warn{color:var(--amber);background:var(--amber-bg);}
  .stamp.late{color:var(--red);background:var(--red-bg);}
  .row-right{display:flex;flex-direction:column;gap:8px;align-items:flex-end;}
  .devolver-form{
    margin-top:10px;
    display:flex;
    gap:8px;
    align-items:center;
  }
  .devolver-form input{width:170px;}
  .search{margin-bottom:14px;}
  table{width:100%;border-collapse:collapse;font-size:.82rem;}
  th{
    text-align:left;
    font-family:var(--mono);
    font-size:.68rem;
    text-transform:uppercase;
    color:var(--ink-soft);
    padding:8px 8px;
    border-bottom:2px solid var(--paper-line);
  }
  td{padding:9px 8px;border-bottom:1px solid var(--paper-line);vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  .toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:var(--navy-deep);
    color:#fff;
    padding:11px 20px;
    border-radius:8px;
    font-size:.85rem;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
  .chave-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(190px, 1fr));
    gap:12px;
  }
  .chave-card{
    border:1px solid var(--paper-line);
    border-radius:10px;
    padding:16px;
    background:#fff;
    aspect-ratio:1 / 1;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    position:relative;
    overflow:hidden;
  }
  .chave-card.late{border-color:var(--red);background:var(--red-bg);}
  .chave-card .cc-numero{
    font-family:var(--mono);
    font-size:.7rem;
    color:var(--ink-soft);
    letter-spacing:.04em;
  }
  .chave-card .cc-nome{
    font-size:1rem;
    font-weight:700;
    color:var(--navy);
    line-height:1.25;
    margin-top:2px;
  }
  .chave-card .cc-linha{
    font-size:.78rem;
    color:var(--ink-soft);
    margin-top:6px;
  }
  .chave-card .cc-linha strong{color:var(--ink);}
  .chave-card .cc-tempo{
    margin-top:auto;
    padding-top:10px;
    border-top:1px dashed var(--paper-line);
    font-family:var(--mono);
    font-size:1.05rem;
    font-weight:700;
    color:var(--green);
  }
  .chave-card.late .cc-tempo{color:var(--red);}
  .chave-card .cc-tempo span{
    display:block;
    font-family:var(--sans);
    font-size:.68rem;
    font-weight:600;
    text-transform:uppercase;
    color:var(--ink-soft);
    letter-spacing:.03em;
  }
  .hint{font-size:.72rem;color:var(--ink-soft);margin-top:4px;}
</style>
</head>
<body>

<header>
  <h1>📋 CONTROLE DE CHAVES</h1>
  <p>Livro de retirada e devolução — balcão de atendimento</p>
</header>

<div class="summary" id="summary"></div>

<div class="tabs">
  <button class="tab active" data-tab="retirar">Retirar chave</button>
  <button class="tab" data-tab="aberto">Em aberto</button>
  <button class="tab" data-tab="emuso">Chave em uso</button>
  <button class="tab" data-tab="historico">Histórico</button>
</div>

<main>

  <!-- RETIRAR -->
  <div class="panel active" id="panel-retirar">
    <div class="card">
      <h2>NOVA RETIRADA</h2>
      <form id="form-retirar">
        <div class="grid">
          <div class="field">
            <label for="chave-select">Chave</label>
            <select id="chave-select" required>
              <option value="" disabled selected>Selecione a chave...</option>
            </select>
          </div>
          <div class="field">
            <label for="retiradoPor">Nome de quem retira</label>
            <input id="retiradoPor" required placeholder="Nome completo">
          </div>
          <div class="field">
            <label for="setor">Setor</label>
            <select id="setor" required>
              <option value="" disabled selected>Selecione o setor...</option>
            </select>
          </div>
          <div class="field">
            <label for="atendenteSaida">Atendente que entregou</label>
            <input id="atendenteSaida" list="lista-atendentes" required placeholder="Seu nome">
            <datalist id="lista-atendentes"></datalist>
          </div>
          <div class="field">
            <label for="previsao">Previsão de devolução</label>
            <input id="previsao" type="time">
          </div>
        </div>
        <div class="field" style="margin-top:14px;">
          <label for="motivo">Motivo do uso (opcional)</label>
          <input id="motivo" placeholder="Ex: Repor produtos no galpão">
        </div>
        <div class="actions">
          <button type="button" class="secondary" id="btn-gerenciar-chaves">+ Cadastrar nova chave</button>
          <span style="flex:1"></span>
          <button type="submit" class="primary">Registrar retirada</button>
        </div>
        <div id="gerenciar-chaves-form" style="display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--paper-line);">
          <div class="grid">
            <div class="field">
              <label for="novo-numero">Número (050 a 100)</label>
              <input id="novo-numero" placeholder="Ex: 066">
            </div>
            <div class="field">
              <label for="novo-nome">Nome da chave</label>
              <input id="novo-nome" placeholder="Ex: Chave do freezer novo">
            </div>
          </div>
          <div class="actions">
            <button type="button" class="primary" id="btn-salvar-nova-chave">Adicionar à lista</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- EM ABERTO -->
  <div class="panel" id="panel-aberto">
    <div class="card">
      <h2>CHAVES ATUALMENTE FORA</h2>
      <div id="lista-aberto"></div>
    </div>
  </div>

  <!-- CHAVE EM USO -->
  <div class="panel" id="panel-emuso">
    <div class="card">
      <h2>CHAVE EM USO</h2>
      <div id="grid-emuso" class="chave-grid"></div>
    </div>
  </div>

  <!-- HISTORICO -->
  <div class="panel" id="panel-historico">
    <div class="card">
      <h2>HISTÓRICO COMPLETO</h2>
      <input class="search" id="busca" placeholder="Buscar por chave, nome ou atendente...">
      <div id="tabela-historico"></div>
    </div>
  </div>

</main>

<div class="toast" id="toast"></div>

<script>
const SETORES = [
  'Limpeza','Cozinha','Adega','Frios','Gerência','Fiscais','Empacotador',
  'Mercearia','Cereais','Açougue','Estoque','Hortifruti','Caixas',
  'Motorista','Delivery','Obra','Manutenção'
];

const CHAVES_INICIAIS = [
  { numero:'050', nome:'Chave do galpão dos vinhos' },
  { numero:'051', nome:'Chave dos whiskys' },
  { numero:'052', nome:'Chave da cozinha' },
  { numero:'053', nome:'Chave da lixeira' },
  { numero:'054', nome:'Chave porta de ferro delivery' },
  { numero:'055', nome:'Chave da Aurélia' },
  { numero:'056', nome:'Chave dos portões' },
  { numero:'057', nome:'Chave portão do estoque' },
  { numero:'058', nome:'Chave escritório' },
  { numero:'059', nome:'Chave galpão do hortifruti' },
  { numero:'060', nome:'Chave armário banheiro cliente' },
  { numero:'061', nome:'Chave da salinha que guarda os produtos de limpeza' },
  { numero:'062', nome:'Chave da Montana' },
  { numero:'063', nome:'Chave da Fiorino' },
  { numero:'064', nome:'Chave do Caminhão VW' },
  { numero:'065', nome:'Chave do caminhão mercedes' }
];

let movimentos = [];
let chavesCadastradas = [];

async function carregar(){
  try{
    const res = await window.storage.get('movimentos', true);
    movimentos = res ? JSON.parse(res.value) : [];
  }catch(e){
    movimentos = [];
  }
  try{
    const res2 = await window.storage.get('chaves-cadastradas', true);
    chavesCadastradas = res2 ? JSON.parse(res2.value) : [];
  }catch(e){
    chavesCadastradas = [];
  }
  if(chavesCadastradas.length === 0){
    chavesCadastradas = CHAVES_INICIAIS;
    await salvarChaves();
  }
  render();
}

async function salvar(){
  try{
    await window.storage.set('movimentos', JSON.stringify(movimentos), true);
  }catch(e){
    mostrarToast('Erro ao salvar. Tente novamente.');
  }
}

async function salvarChaves(){
  try{
    await window.storage.set('chaves-cadastradas', JSON.stringify(chavesCadastradas), true);
  }catch(e){
    mostrarToast('Erro ao salvar lista de chaves.');
  }
}

function uid(){
  return 'm_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
}

function fmtDataHora(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleString('pt-BR', {day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});
}

function fmtHora(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}

function previsaoISO(horaStr){
  if(!horaStr) return null;
  const [h,m] = horaStr.split(':').map(Number);
  const d = new Date();
  d.setHours(h,m,0,0);
  return d.toISOString();
}

function tempoDecorrido(iso){
  if(!iso) return '—';
  const ms = new Date() - new Date(iso);
  const totalMin = Math.max(0, Math.floor(ms/60000));
  const h = Math.floor(totalMin/60);
  const m = totalMin % 60;
  if(h === 0) return m + 'min';
  return h + 'h ' + m + 'min';
}
function statusDe(mv){
  if(mv.devolvido) return {label:'DEVOLVIDA', cls:'ok'};
  if(mv.previsaoDevolucao && new Date(mv.previsaoDevolucao) < new Date()) return {label:'ATRASADA', cls:'late'};
  return {label:'EM ABERTO', cls:'warn'};
}

function mostrarToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2400);
}

// Tabs
document.querySelectorAll('.tab').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
    render();
  });
});

// Form retirar
document.getElementById('form-retirar').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const chaveSel = document.getElementById('chave-select');
  const opt = chaveSel.options[chaveSel.selectedIndex];
  const mv = {
    id: uid(),
    numero: opt.dataset.numero,
    chave: opt.dataset.nome,
    setor: document.getElementById('setor').value,
    motivo: document.getElementById('motivo').value.trim(),
    retiradoPor: document.getElementById('retiradoPor').value.trim(),
    atendenteSaida: document.getElementById('atendenteSaida').value.trim(),
    dataHoraSaida: new Date().toISOString(),
    previsaoDevolucao: previsaoISO(document.getElementById('previsao').value),
    devolvido: false,
    atendenteEntrada: null,
    dataHoraEntrada: null
  };
  movimentos.push(mv);
  await salvar();
  e.target.reset();
  mostrarToast('Retirada registrada: ' + mv.chave);
  document.querySelector('.tab[data-tab="aberto"]').click();
});

// Cadastro de novas chaves
document.getElementById('btn-gerenciar-chaves').addEventListener('click', ()=>{
  const painel = document.getElementById('gerenciar-chaves-form');
  painel.style.display = painel.style.display === 'none' ? 'block' : 'none';
});

document.getElementById('btn-salvar-nova-chave').addEventListener('click', async ()=>{
  const numero = document.getElementById('novo-numero').value.trim();
  const nome = document.getElementById('novo-nome').value.trim();
  if(!numero || !nome){
    mostrarToast('Preencha número e nome da chave.');
    return;
  }
  if(chavesCadastradas.some(c=>c.numero === numero)){
    mostrarToast('Já existe uma chave com esse número.');
    return;
  }
  chavesCadastradas.push({numero, nome});
  chavesCadastradas.sort((a,b)=> a.numero.localeCompare(b.numero));
  await salvarChaves();
  document.getElementById('novo-numero').value = '';
  document.getElementById('novo-nome').value = '';
  document.getElementById('gerenciar-chaves-form').style.display = 'none';
  renderSelects();
  mostrarToast('Chave cadastrada: ' + numero + ' — ' + nome);
});

async function registrarDevolucao(id, nomeAtendente){
  const mv = movimentos.find(m=>m.id===id);
  if(!mv) return;
  mv.devolvido = true;
  mv.dataHoraEntrada = new Date().toISOString();
  mv.atendenteEntrada = nomeAtendente;
  await salvar();
  mostrarToast('Devolução registrada: ' + mv.chave);
  render();
}

function render(){
  renderSummary();
  renderSelects();
  renderAutocomplete();
  renderAberto();
  renderEmUso();
  renderHistorico();
}

function renderSelects(){
  const chaveSel = document.getElementById('chave-select');
  const valorAtual = chaveSel.value;
  chaveSel.innerHTML = '<option value="" disabled selected>Selecione a chave...</option>' +
    [...chavesCadastradas].sort((a,b)=>a.numero.localeCompare(b.numero)).map(c=>
      `<option value="${escapeHtml(c.numero)}" data-numero="${escapeHtml(c.numero)}" data-nome="${escapeHtml(c.nome)}">${escapeHtml(c.numero)} — ${escapeHtml(c.nome)}</option>`
    ).join('');
  if(valorAtual) chaveSel.value = valorAtual;

  const setorSel = document.getElementById('setor');
  if(setorSel.options.length <= 1){
    setorSel.innerHTML = '<option value="" disabled selected>Selecione o setor...</option>' +
      SETORES.map(s=>`<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');
  }
}

function renderSummary(){
  const abertos = movimentos.filter(m=>!m.devolvido);
  const atrasados = abertos.filter(m=> m.previsaoDevolucao && new Date(m.previsaoDevolucao) < new Date());
  const el = document.getElementById('summary');
  el.innerHTML = `
    <div class="pill"><span>Chaves fora</span><b>${abertos.length}</b></div>
    <div class="pill warn"><span>Atrasadas</span><b>${atrasados.length}</b></div>
    <div class="pill"><span>Registros no histórico</span><b>${movimentos.length}</b></div>
  `;
}

function renderAutocomplete(){
  const atendentes = [...new Set(movimentos.flatMap(m=>[m.atendenteSaida, m.atendenteEntrada]).filter(Boolean))];
  document.getElementById('lista-atendentes').innerHTML = atendentes.map(a=>`<option value="${escapeHtml(a)}">`).join('');
}

function chaveLabel(mv){
  return (mv.numero ? escapeHtml(mv.numero)+' — ' : '') + escapeHtml(mv.chave);
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s ?? '';
  return d.innerHTML;
}

function renderAberto(){
  const abertos = movimentos.filter(m=>!m.devolvido).sort((a,b)=> new Date(a.dataHoraSaida)-new Date(b.dataHoraSaida));
  const el = document.getElementById('lista-aberto');
  if(abertos.length===0){
    el.innerHTML = '<div class="empty">Nenhuma chave em aberto no momento.</div>';
    return;
  }
  el.innerHTML = abertos.map(mv=>{
    const st = statusDe(mv);
    return `
    <div class="row" data-id="${mv.id}">
      <div class="row-info">
        <b>${chaveLabel(mv)}</b>
        <div class="row-meta">
          Com: <strong>${escapeHtml(mv.retiradoPor)}</strong>${mv.setor ? ' · '+escapeHtml(mv.setor):''}${mv.motivo ? ' · '+escapeHtml(mv.motivo):''}<br>
          Retirada: ${fmtDataHora(mv.dataHoraSaida)} por ${escapeHtml(mv.atendenteSaida)}
          ${mv.previsaoDevolucao ? ' · Previsão: '+fmtHora(mv.previsaoDevolucao) : ''}
        </div>
      </div>
      <div class="row-right">
        <span class="stamp ${st.cls}">${st.label}</span>
        <button class="secondary btn-abrir-devolucao" data-id="${mv.id}">Registrar devolução</button>
      </div>
    </div>`;
  }).join('');

  el.querySelectorAll('.btn-abrir-devolucao').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const row = btn.closest('.row');
      if(row.querySelector('.devolver-form')) return;
      const form = document.createElement('div');
      form.className = 'devolver-form';
      form.innerHTML = `
        <input type="text" placeholder="Seu nome (quem recebe)" class="input-atendente-entrada">
        <button class="primary btn-confirmar-devolucao">Confirmar</button>
      `;
      row.appendChild(form);
      form.querySelector('.btn-confirmar-devolucao').addEventListener('click', ()=>{
        const nome = form.querySelector('.input-atendente-entrada').value.trim();
        if(!nome){ mostrarToast('Informe o nome de quem está recebendo a chave.'); return; }
        registrarDevolucao(btn.dataset.id, nome);
      });
    });
  });
}

function renderEmUso(){
  const abertos = movimentos.filter(m=>!m.devolvido).sort((a,b)=> new Date(a.dataHoraSaida)-new Date(b.dataHoraSaida));
  const el = document.getElementById('grid-emuso');
  if(abertos.length===0){
    el.innerHTML = '<div class="empty">Nenhuma chave em uso no momento.</div>';
    return;
  }
  el.innerHTML = abertos.map(mv=>{
    const st = statusDe(mv);
    return `
    <div class="chave-card ${st.cls === 'late' ? 'late' : ''}">
      <div>
        <div class="cc-numero">Nº ${escapeHtml(mv.numero||'—')}</div>
        <div class="cc-nome">${escapeHtml(mv.chave)}</div>
        <div class="cc-linha">Com: <strong>${escapeHtml(mv.retiradoPor)}</strong></div>
        <div class="cc-linha">${escapeHtml(mv.setor||'—')}</div>
        <div class="cc-linha">Retirada às ${fmtHora(mv.dataHoraSaida)}</div>
      </div>
      <div class="cc-tempo">
        <span>Tempo em uso</span>
        ${tempoDecorrido(mv.dataHoraSaida)}
      </div>
    </div>`;
  }).join('');
}

function renderHistorico(){
  const termo = (document.getElementById('busca').value || '').toLowerCase();
  const lista = [...movimentos].sort((a,b)=> new Date(b.dataHoraSaida)-new Date(a.dataHoraSaida))
    .filter(mv => {
      if(!termo) return true;
      return [mv.numero, mv.chave, mv.retiradoPor, mv.atendenteSaida, mv.atendenteEntrada, mv.setor, mv.motivo]
        .filter(Boolean).some(v => v.toLowerCase().includes(termo));
    });
  const el = document.getElementById('tabela-historico');
  if(lista.length===0){
    el.innerHTML = '<div class="empty">Nenhum registro encontrado.</div>';
    return;
  }
  el.innerHTML = `
  <table>
    <thead>
      <tr>
        <th>Nº</th>
        <th>Chave</th>
        <th>Retirado por</th>
        <th>Saída</th>
        <th>Entrega feita por</th>
        <th>Devolução</th>
        <th>Recebido por</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      ${lista.map(mv=>{
        const st = statusDe(mv);
        return `<tr>
          <td><strong>${escapeHtml(mv.numero||'—')}</strong></td>
          <td>${escapeHtml(mv.chave)}${mv.setor?'<br><span style="color:var(--ink-soft);font-size:.75rem">'+escapeHtml(mv.setor)+(mv.motivo?' · '+escapeHtml(mv.motivo):'')+'</span>':''}</td>
          <td>${escapeHtml(mv.retiradoPor)}</td>
          <td>${fmtDataHora(mv.dataHoraSaida)}</td>
          <td>${escapeHtml(mv.atendenteSaida)}</td>
          <td>${mv.devolvido ? fmtDataHora(mv.dataHoraEntrada) : '—'}</td>
          <td>${mv.devolvido ? escapeHtml(mv.atendenteEntrada) : '—'}</td>
          <td><span class="stamp ${st.cls}">${st.label}</span></td>
        </tr>`;
      }).join('')}
    </tbody>
  </table>`;
}

document.getElementById('busca').addEventListener('input', renderHistorico);

carregar();
setInterval(render, 30000); // atualiza status de atraso automaticamente
</script>

</body>
