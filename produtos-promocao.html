<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produtos em Promoção — SuperVille</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--ink:#231F20;--ink-soft:#414042;--paper:#f5f6f4;--paper-line:#dfe3df;--card:#fff;--navy:#004C45;--navy-deep:#231F20;--brand-green:#3BB87E;--amber:#8a6a1e;--amber-bg:#FFFADD;--red:#a8342a;--red-bg:#fbe9e6;--green:#3BB87E;--green-bg:#e9f8f0;
    --mono:'Montserrat',ui-monospace,Menlo,monospace;--sans:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--sans);background:repeating-linear-gradient(var(--paper),var(--paper) 27px,var(--paper-line) 28px),var(--paper);color:var(--ink);min-height:100vh;padding-bottom:60px;}
  header{background:var(--navy);color:#fff;padding:22px 24px 20px;border-bottom:6px solid var(--navy-deep);}
  header h1{margin:0;font-size:1.4rem;letter-spacing:.03em;font-family:var(--mono);font-weight:700;}
  header p{margin:6px 0 0;color:#c3cbe0;font-size:.85rem;}
  .brand{display:flex;align-items:center;gap:14px;}
  .brand-logo{width:52px;height:52px;border-radius:12px;object-fit:cover;flex-shrink:0;}
  .tabs{max-width:960px;margin:18px auto 0;padding:0 16px;display:flex;gap:6px;flex-wrap:wrap;}
  .tab{padding:10px 16px;background:transparent;border:none;border-bottom:3px solid transparent;font-family:var(--sans);font-weight:600;font-size:.88rem;color:var(--ink-soft);cursor:pointer;text-decoration:none;display:inline-block;}
  .tab.active{color:var(--navy);border-bottom-color:var(--brand-green);}
  main{max-width:960px;margin:14px auto 0;padding:0 16px;}
  .card{background:var(--card);border:1px solid var(--paper-line);border-radius:10px;padding:22px;box-shadow:0 1px 2px rgba(23,32,58,.05);}
  h2{font-size:1rem;margin:0 0 16px;color:var(--navy);font-family:var(--mono);}
  h2.sec{margin:26px 0 12px;text-transform:uppercase;letter-spacing:.05em;}
  label{display:block;font-size:.75rem;font-weight:600;color:var(--ink-soft);margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em;}
  input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--paper-line);border-radius:6px;font-size:.92rem;font-family:var(--sans);color:var(--ink);background:#fff;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--amber);outline-offset:1px;}
  .fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;}
  .full{grid-column:1/-1;}
  .hint{font-size:.78rem;color:var(--ink-soft);}
  button{font-family:var(--sans);}
  button.primary{background:var(--navy);color:#fff;border:none;padding:11px 22px;border-radius:6px;font-weight:600;font-size:.88rem;cursor:pointer;}
  button.primary:disabled{opacity:.5;cursor:default;}
  button.primary:hover:not(:disabled){background:var(--navy-deep);}
  button.secondary{background:#fff;color:var(--navy);border:1px solid var(--navy);padding:8px 14px;border-radius:6px;font-weight:600;font-size:.8rem;cursor:pointer;}
  button.danger{background:#fff;color:var(--red);border:1px solid var(--red);padding:8px 14px;border-radius:6px;font-weight:600;font-size:.8rem;cursor:pointer;}
  .empty{color:var(--ink-soft);padding:14px 4px;font-size:.9rem;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy-deep);color:#fff;padding:11px 20px;border-radius:8px;font-size:.85rem;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20;}
  .ov{position:fixed;inset:0;background:rgba(10,20,15,.6);display:none;align-items:center;justify-content:center;padding:14px;z-index:30;}
  .ov.on{display:flex;}
  .md{background:#fff;border-radius:12px;max-width:480px;width:100%;max-height:92%;overflow:auto;padding:22px;}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
  .foto-item{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:1px dashed var(--paper-line);}
  .foto-item input[type=file]{flex:1;min-width:150px;font-size:.78rem;padding:4px;}
  .foto-status{font-size:.75rem;color:var(--ink-soft);white-space:nowrap;}
  .toast.show{opacity:1;}
  #login-screen{max-width:380px;margin:80px auto;padding:0 16px;}
  #login-screen h2{text-align:center;font-size:1.1rem;}
  .erro-login{color:var(--red);font-size:.8rem;margin-top:10px;text-align:center;display:none;}
  .subnav{display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid var(--paper-line);}
  .subtab{background:transparent;border:none;border-bottom:3px solid transparent;padding:10px 14px;font:700 .82rem var(--sans);color:var(--ink-soft);cursor:pointer;}
  .subtab.active{color:var(--navy);border-bottom-color:var(--navy);}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:10px;}
  .stat-box{background:var(--paper);border:1px solid var(--paper-line);border-radius:8px;padding:12px;text-align:center;}
  .stat-box .num{font:700 1.4rem var(--mono);color:var(--navy);display:block;}
  .stat-box .lbl{font-size:.65rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;}
  .depto-head{font:700 .78rem var(--mono);color:var(--navy);text-transform:uppercase;letter-spacing:.05em;margin:18px 0 4px;padding-bottom:4px;border-bottom:1px solid var(--paper-line);}
  .secao-head{font:700 .72rem var(--sans);color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin:10px 0 6px;}
  .prod-block{padding:10px 0;border-bottom:1px dashed var(--paper-line);}
  .prod-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .obs-row{margin-top:6px;}
  .obs-row input{font-size:.78rem;padding:6px 9px;}
  .prod-info{flex:1;min-width:200px;}
  .prod-info .cod{font:700 .68rem var(--mono);color:var(--ink-soft);}
  .prod-info .desc{font-weight:600;font-size:.88rem;}
  .prod-info .preco{color:var(--navy);font-weight:700;}
  .prod-info .periodo{font-size:.72rem;color:var(--ink-soft);}
  .marc-btns{display:flex;gap:8px;flex-shrink:0;}
  .marc-btns button{font:800 .82rem var(--sans);padding:11px 18px;border-radius:8px;cursor:pointer;border:2px solid var(--paper-line);background:#fff;color:var(--ink-soft);min-width:52px;}
  .marc-btns button.on-ok{background:var(--green-bg);color:var(--green);border-color:var(--green);}
  .marc-btns button.on-sp{background:var(--red-bg);color:var(--red);border-color:var(--red);}
  .marc-btns button.on-se{background:var(--amber-bg);color:var(--amber);border-color:var(--amber);}
  .pend-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:1px dashed var(--paper-line);}
  .pend-row .info{flex:1;min-width:200px;font-size:.85rem;}
  .pend-row .info b{display:block;}
  .pend-row .meta{font-size:.72rem;color:var(--ink-soft);}
  .tag{display:inline-block;font:700 .65rem var(--mono);letter-spacing:.05em;padding:3px 8px;border-radius:4px;color:var(--amber);background:var(--amber-bg);border:1px solid currentColor;}
  .tag.ok{color:var(--green);background:var(--green-bg);}
  .tag.rej{color:var(--red);background:var(--red-bg);}
  .tag.cinza{color:var(--ink-soft);background:var(--paper);}
  .preview-depto{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--paper-line);font-size:.85rem;}
  .aviso-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:1px dashed var(--paper-line);}
  .aviso-row .info{flex:1;min-width:140px;font-size:.88rem;}
  .aviso-row input{width:170px;flex-shrink:0;}
  .tbl-wrap{overflow-x:auto;}
  .tbl{width:100%;border-collapse:collapse;font-size:.82rem;min-width:560px;}
  .tbl th{text-align:left;font-size:.66rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);padding:6px 6px;border-bottom:2px solid var(--paper-line);}
  .tbl td{padding:10px 6px;border-bottom:1px dashed var(--paper-line);vertical-align:top;}
  .tbl td small{display:block;color:var(--ink-soft);font-size:.7rem;margin-top:2px;}
  .insight{background:var(--amber-bg);border-radius:8px;padding:10px 12px;font-size:.84rem;margin:0 0 8px;}
  .barra-bg{background:var(--paper);border-radius:5px;height:10px;overflow:hidden;margin:8px 0 14px;}
  .barra-fill{height:100%;background:var(--navy);border-radius:5px;}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<style id="padrao-superville">
  /* =====================================================================
     PADRÃO SUPERVILLE — identidade visual (não altera nenhuma lógica)
     Preto + branco + verde SuperVille (#3BB072) · Montserrat / Arial
     ===================================================================== */
  :root{
    --sv-green:#3BB072; --sv-green-deep:#2A8A56; --sv-green-soft:#E8F5EE;
    --sv-black:#000000; --sv-zebra:#F3F8F5;
    --ink:#1A1A1A; --ink-soft:#5E6662;
    --paper:#F4F6F5; --paper-line:#E0E5E2;
    --card:#FFFFFF; --card-alt:#F7F9F8; --header-bg:#000000;
    --navy:#2A8A56; --navy-deep:#1F6B42; --steel:#5E6662;
    --amber:#C47F2C; --amber-bg:#FBF1E2;
    --red:#C0392B; --red-bg:#FBE9E6;
    --green:#2A8A56; --green-bg:#E8F5EE;
    --mono:'Montserrat', Arial, Helvetica, sans-serif;
    --sans:Arial, Helvetica, sans-serif;
  }
  body{background:var(--paper) !important;color:var(--ink);font-family:var(--sans);}

  /* Cabeçalho preto com logo no canto superior esquerdo */
  header, .rel-header{background:var(--sv-black) !important;color:#fff;border:none !important;
    border-bottom:4px solid var(--sv-green) !important;}
  .rel-header{border-radius:10px;}
  header h1, .rel-header h1{font-family:'Montserrat', Arial, sans-serif;font-weight:800;letter-spacing:.04em;color:#fff;}
  header p, .rel-header p{color:#C9CFCC !important;}
  header p b{color:#fff;}
  .brand-logo{border-radius:8px !important;box-shadow:0 0 0 1px rgba(255,255,255,.12);}

  /* Títulos de seção: preto com barra verde */
  h2{font-family:'Montserrat', Arial, sans-serif;font-weight:800;color:var(--ink);letter-spacing:.02em;
    border-left:4px solid var(--sv-green);padding-left:10px;}
  #login-screen h2{border-left:none;padding-left:0;}
  .modal-box h2{border-left-color:var(--red);}

  /* Abas */
  .tabs{flex-wrap:wrap;row-gap:0;}
  .tab{font-family:'Montserrat', Arial, sans-serif;white-space:nowrap;padding-left:12px !important;padding-right:12px !important;}
  .tab.active{color:var(--sv-black) !important;border-bottom-color:var(--sv-green) !important;}
  .tab:hover{color:var(--sv-black);}
  .subtab{font-family:'Montserrat', Arial, sans-serif;}
  .subtab.active{color:var(--sv-black) !important;border-bottom-color:var(--sv-green) !important;}

  /* Botões */
  button.primary{background:var(--sv-green);font-family:'Montserrat', Arial, sans-serif;font-weight:700;}
  button.primary:hover, button.primary:hover:not(:disabled){background:var(--sv-green-deep);}
  button.primary:disabled{background:#C5CCC8 !important;color:#fff !important;}
  button.secondary{color:var(--sv-green-deep);border-color:var(--sv-green);font-family:'Montserrat', Arial, sans-serif;}
  button.secondary:hover{background:var(--sv-green-soft);}
  button.danger{font-family:'Montserrat', Arial, sans-serif;}
  button.grande{background:var(--sv-black);border-bottom:4px solid var(--sv-green);font-family:'Montserrat', Arial, sans-serif;}
  button.grande:hover{background:#1c1c1c;}

  /* Campos */
  input:focus, select:focus, textarea:focus{outline:2px solid var(--sv-green) !important;outline-offset:1px;}

  /* Tabelas: cabeçalho preto, linhas zebradas */
  th{background:var(--sv-black);color:#fff !important;font-family:'Montserrat', Arial, sans-serif;
    font-weight:700;letter-spacing:.04em;border-bottom:none !important;padding:9px 10px !important;}
  thead tr th:first-child{border-top-left-radius:6px;}
  thead tr th:last-child{border-top-right-radius:6px;}
  tbody tr:nth-child(even) td{background:var(--sv-zebra);}
  tr.total td, tr.totais td, tfoot td{background:var(--sv-green) !important;color:#fff;font-weight:700;}

  /* Números e destaques */
  .pill b, .stat-box .num, .big, .cc-tempo, .depto-head, .fs{font-family:'Montserrat', Arial, sans-serif;}
  .pill{border-left:4px solid var(--sv-green);}
  .stat-box{background:#fff !important;border-top:3px solid var(--sv-green);}
  .barra-fill{background:var(--sv-green) !important;}
  .depto-head{color:var(--sv-black);border-bottom:2px solid var(--sv-green);}

  /* Cards */
  .cafe-card, .chave-card, .cd, .grupo-btn{border-top:3px solid var(--sv-green);}
  .cafe-card.late, .chave-card.late{border-top-color:var(--red);}
  .cd:hover{border-color:var(--sv-green);}
  .sessao-banner{background:var(--sv-green-soft);border-color:var(--sv-green);}
  .sessao-banner b{color:var(--sv-black);}

  /* Botão grande de atalho (Chaves → Recrutamento) */
  .btn-rec{background:var(--sv-black) !important;border-bottom:5px solid var(--sv-green) !important;}
  .btn-rec:hover{background:#1c1c1c !important;}
  .btn-rec small{color:#C9CFCC !important;}

  /* Avisos */
  .toast{background:var(--sv-black) !important;border-left:4px solid var(--sv-green);}
  .modal-overlay, .ov{background:rgba(0,0,0,.6) !important;}

  /* ---------- Relatório do Café (link enviado à gerência) ---------- */
  .rel-header .brand{display:flex;align-items:center;gap:14px;}
  .rel-header .sv-rel-top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
  .rel-header img.sv-rel-logo{width:52px;height:52px;border-radius:8px;flex-shrink:0;}
  #rel-conteudo h2{color:var(--ink) !important;font-family:'Montserrat', Arial, sans-serif !important;}
  #rel-conteudo .summary{display:flex;gap:10px;flex-wrap:wrap;max-width:none;}
  .sv-rodape{margin:14px 0 0;text-align:center;font-size:.75rem;color:var(--ink-soft);}
  .sv-rodape b{font-family:'Montserrat', Arial, sans-serif;color:var(--ink);}

  /* Botão Imprimir / Salvar PDF */
  button.sv-print-btn{display:inline-flex;align-items:center;gap:6px;background:var(--sv-black);color:#fff;border:none;
    border-bottom:3px solid var(--sv-green);border-radius:6px;padding:9px 14px;font:700 .78rem 'Montserrat', Arial, sans-serif;
    letter-spacing:.03em;cursor:pointer;white-space:nowrap;}
  button.sv-print-btn:hover{background:#1c1c1c;}
  .rel-header button.sv-print-btn{background:var(--sv-green);border-bottom-color:var(--sv-green-deep);}
  .sv-print-bar{display:flex;justify-content:flex-end;margin:0 0 12px;}
  .sv-print-head, #sv-print-root{display:none;}

  /* ---------- Celular ---------- */
  @media (max-width:640px){
    header{padding:16px 16px 14px !important;}
    header h1{font-size:1.12rem !important;}
    header p{font-size:.78rem !important;}
    .brand-logo{width:44px !important;height:44px !important;}
    .rel-header{padding:16px !important;}
    .rel-header h1{font-size:1.05rem !important;}
    .rel-header button.sv-print-btn{width:100%;justify-content:center;}
    main, .summary, .tabs{padding-left:12px !important;padding-right:12px !important;}
    #app-relatorio{padding:0 12px !important;margin-top:12px !important;}
    .card{padding:16px !important;}
    .tab{padding:9px 10px !important;font-size:.82rem !important;}
    .actions{flex-wrap:wrap;}
    .row{flex-wrap:wrap;}
    .subnav{flex-wrap:wrap;overflow:visible;}
    .subtab{white-space:nowrap;padding:9px 10px !important;}
    .stat-grid{grid-template-columns:repeat(3,1fr) !important;gap:6px !important;}
    .stat-grid:has(> :nth-child(5):last-child){grid-template-columns:repeat(5,1fr) !important;}
    .stat-grid:has(> :nth-child(4):last-child){grid-template-columns:repeat(2,1fr) !important;}
    .stat-box{padding:9px 4px !important;}
    .stat-box .num{font-size:1.15rem !important;}
    .stat-box .lbl{font-size:.56rem !important;letter-spacing:.02em !important;line-height:1.25;display:block;}

    /* Tabelas viram cartões empilhados */
    table.sv-rt thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}
    table.sv-rt, table.sv-rt tbody, table.sv-rt tr, table.sv-rt td{display:block;width:100%;}
    table.sv-rt tr{background:#fff;border:1px solid var(--paper-line);border-left:4px solid var(--sv-green);
      border-radius:8px;padding:4px 12px;margin-bottom:10px;}
    table.sv-rt tbody tr:nth-child(even) td{background:none;}
    table.sv-rt tbody tr:nth-child(even){background:var(--sv-zebra);}
    table.sv-rt td{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;text-align:right;
      padding:7px 0 !important;border-bottom:1px dashed var(--paper-line) !important;word-break:break-word;}
    table.sv-rt td:last-child{border-bottom:none !important;}
    table.sv-rt td::before{content:attr(data-label);flex-shrink:0;text-align:left;max-width:45%;
      font:700 .66rem 'Montserrat', Arial, sans-serif;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);padding-top:2px;}
    table.sv-rt td:first-child{display:block;text-align:left;font-size:1rem;padding-top:10px !important;}
    table.sv-rt td:first-child::before{display:block;max-width:none;margin-bottom:2px;}
    table.sv-rt td[colspan]{display:block;text-align:center;}
    table.sv-rt td[colspan]::before{display:none;}
  }

  /* ---------- Impressão / PDF no padrão SuperVille ---------- */
  @media print{
    @page{size:A4;margin:12mm;}
    *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important;}
    body{background:#fff !important;padding:0 !important;font-size:11pt;}
    .tabs, .subnav, nav, .toast, .modal-overlay, .ov, #login-screen, .btn-rec, .link-box, .actions,
    button, input[type=file], .sv-print-bar, .summary:empty{display:none !important;}
    .card{box-shadow:none !important;}
    .card .card, .stat-grid{break-inside:avoid;}
    .sv-rodape{display:none !important;}
    h2{break-after:avoid;}
    tr, .cafe-card, .chave-card, .cd, .stat-box, .pend-row{break-inside:avoid;}
    thead{display:table-header-group;}
    main, #app-relatorio{max-width:none !important;padding:0 !important;margin:0 !important;}
    table.sv-rt thead{position:static;width:auto;height:auto;clip:auto;}
    body::after{content:"SuperVille Supermercado  ·  Gerado em " attr(data-sv-gerado);display:block;margin-top:14px;
      padding-top:8px;border-top:2px solid var(--sv-green);font:600 8.5pt 'Montserrat', Arial, sans-serif;color:#5E6662;text-align:center;}
    /* Quando o botão "Imprimir / Salvar PDF" é usado, só o relatório vai para o papel */
    body.sv-printing > *:not(#sv-print-root):not(.sv-print-head){display:none !important;}
    body.sv-printing .sv-print-head{display:flex !important;align-items:center;gap:12px;background:#000;color:#fff;
      padding:12px 16px;border-bottom:4px solid var(--sv-green);margin-bottom:14px;border-radius:6px;}
    .sv-print-head img{width:46px;height:46px;border-radius:6px;}
    .sv-print-head b{display:block;font:800 13pt 'Montserrat', Arial, sans-serif;letter-spacing:.04em;}
    .sv-print-head span{font-size:9pt;color:#C9CFCC;}
    body.sv-printing #sv-print-root{display:block !important;}
    #sv-print-root [style*="display:none"]{display:none !important;}
  }
  .card > .sv-print-bar{float:right;margin:-4px 0 8px 12px;}
  @media (max-width:640px){ .card > .sv-print-bar{float:none;margin:0 0 12px;} .sv-print-bar .sv-print-btn{width:100%;justify-content:center;} }
  .card > .sv-print-bar ~ div{clear:both;}
  /* Botão de anexar arquivo / tirar foto */
  input[type=file]::file-selector-button{background:var(--sv-black);color:#fff;border:none;border-bottom:3px solid var(--sv-green);
    border-radius:6px;padding:7px 12px;margin-right:10px;font:700 .75rem 'Montserrat', Arial, sans-serif;cursor:pointer;}
  input[type=file]::file-selector-button:hover{background:#1c1c1c;}
  .foto-status{font-family:'Montserrat', Arial, sans-serif;font-weight:700;}
  .md{border-top:4px solid var(--sv-green);}
  /* Promoções — avisos, histórico e insights */
  .insight{border-left:4px solid var(--amber);}
  .aviso-row .info b{font-family:'Montserrat', Arial, sans-serif;}
  .preview-depto span:first-child{font-family:'Montserrat', Arial, sans-serif;font-weight:700;}
  .tbl th{color:#fff !important;font-size:.68rem !important;}
  @media (max-width:640px){
    table.sv-rt{min-width:0 !important;}
    table.sv-rt td{flex-wrap:wrap;}
    table.sv-rt td small{flex-basis:100%;text-align:right;margin-top:0 !important;}

function comprimirImagem(file,maxW=640,qualidade=.6){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{const img=new Image();
      img.onload=()=>{
        const escala=Math.min(1,maxW/img.width),w=Math.round(img.width*escala),h=Math.round(img.height*escala);
        const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',qualidade));
      };img.onerror=reject;img.src=e.target.result;};
    reader.onerror=reject;reader.readAsDataURL(file);
  });
}

/* ===== Leitor de PDF (roda no navegador, sem precisar de servidor) ===== */
async function linhasDoPDF(file){
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:new Uint8Array(buf),disableWorker:true}).promise;
  const linhas=[];
  for(let n=1;n<=pdf.numPages;n++){
    const page=await pdf.getPage(n);
    const content=await page.getTextContent();
    const itens=content.items.filter(it=>it.str&&it.str.trim()!=='').map(it=>({str:it.str,x:it.transform[4],y:it.transform[5]}));
    itens.sort((a,b)=>b.y-a.y||a.x-b.x);
    let grupo=null,ultimoY=null;const TOL=2.5;
    itens.forEach(it=>{
      if(ultimoY===null||Math.abs(it.y-ultimoY)>TOL){grupo=[];linhas.push(grupo);ultimoY=it.y}
      grupo.push(it);
    });
  }
  return linhas.map(g=>g.sort((a,b)=>a.x-b.x).map(i=>i.str).join(' ').replace(/\s+/g,' ').trim());
}
const ROW_RE=/^(\d{3,6}-\d)\s+(.+?)\s+(-?\d+\.\d{2})\s+(-?\d+\.\d{2})\s+([A-Z])\s+(-?\d+\.\d{2})\s+(-?\d+\.\d{2})\s+(\d{2}\/\d{2}\/\d{4})\s+(\d{2}\/\d{2}\/\d{4})\s*$/;
const DEPTO_RE=/^Departamento:\s*(\d+)\s+(.+)$/;
const SECAO_RE=/^Sec[aã]o:\s*(\d+)\s+(.+)$/;
const NUM='(-?\\d+(?:\\.\\d+)?)';
const LINE2_RE=new RegExp('^[A-Z]{1,4}\\s+'+NUM+'\\s+'+NUM+'\\s+'+NUM+'\\s+'); // unidade, qtd. da embalagem, ESTOQUE, SAÍDA dos últimos 10 dias
const BOILERPLATE_RE=/^(SACOLAO CORIOLANO|RELAT[OÓ]RIO DOS PRODUTOS|C[OÓ]D\.?PL|EMBALAGEM)/i; // cabeçalho repetido em cada página
function parseLinhas(linhas){
  const deptos={};let dAtual=null,sAtual=null,ultimoProduto=null,esperandoLinha2=false;
  linhas.forEach(linha=>{
    let m;
    if((m=DEPTO_RE.exec(linha))){const cod=m[1];dAtual={codigo:cod,nome:m[2].trim()};if(!deptos[cod])deptos[cod]={codigo:cod,nome:dAtual.nome,secoes:{}};sAtual=null;esperandoLinha2=false;return}
    if((m=SECAO_RE.exec(linha))){sAtual={codigo:m[1],nome:m[2].trim()};esperandoLinha2=false;return}
    if((m=ROW_RE.exec(linha))&&dAtual){
      const dep=deptos[dAtual.codigo],chave=sAtual?sAtual.codigo:'_geral';
      if(!dep.secoes[chave])dep.secoes[chave]={codigo:chave,nome:sAtual?sAtual.nome:'Geral',produtos:[]};
      const produto={codigo:m[1],desc:m[2].trim(),precoVenda:parseFloat(m[6]),precoEspecial:parseFloat(m[7]),inicio:m[8],fim:m[9]};
      dep.secoes[chave].produtos.push(produto);ultimoProduto=produto;esperandoLinha2=true;return;
    }
    if(esperandoLinha2){
      if(BOILERPLATE_RE.test(linha))return; // cabeçalho repetido na quebra de página: ignora e continua esperando
      if(ultimoProduto&&(m=LINE2_RE.exec(linha))){ultimoProduto.estoque=parseFloat(m[2]);ultimoProduto.saida10=parseFloat(m[3])}
      esperandoLinha2=false;
    }
  });
  return deptos;
}
function mesclarCatalogos(lista){
  const deptos={};
  lista.forEach(dep=>{Object.values(dep).forEach(d=>{
    if(!deptos[d.codigo])deptos[d.codigo]={codigo:d.codigo,nome:d.nome,secoes:{}};
    Object.values(d.secoes).forEach(s=>{
      if(!deptos[d.codigo].secoes[s.codigo])deptos[d.codigo].secoes[s.codigo]={codigo:s.codigo,nome:s.nome,produtos:[]};
      const destino=deptos[d.codigo].secoes[s.codigo],mapa=new Map(destino.produtos.map(p=>[p.codigo,p]));
      s.produtos.forEach(p=>mapa.set(p.codigo,p));
      destino.produtos=[...mapa.values()];
    });
  })});
  return deptos;
}
function contarCatalogo(deptos){let total=0;Object.values(deptos).forEach(d=>Object.values(d.secoes).forEach(s=>total+=s.produtos.length));return total}

/* ===== Helpers de catálogo/marcações do dia ===== */
function flatten(doc){const out=[];if(!doc||!doc.catalogo)return out;
  const vistos=new Set(); // evita produto duplicado caso o mesmo código apareça em mais de uma seção
  Object.values(doc.catalogo.deptos||{}).forEach(d=>Object.values(d.secoes).forEach(s=>s.produtos.forEach(p=>{
    if(vistos.has(p.codigo))return;vistos.add(p.codigo);
    out.push({...p,deptoCodigo:d.codigo,deptoNome:d.nome,secaoNome:s.nome});
  })));
  return out}

/* ===== Histórico e comparação ===== */
let historicoCache={};
function isoDe(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmtDur(ms){
  const m=Math.round(ms/60000);
  if(m<60)return m+'min';
  const h=Math.floor(m/60);
  if(h<24)return h+'h '+(m%60)+'min';
  return Math.floor(h/24)+'d '+(h%24)+'h';
}
function calcularHistorico(docs){
  const porSetor={};
  SETORES.forEach(s=>porSetor[s.usuario]={setor:s,dias:0,finalizou:0,tempos:[],ok:0,sp:0,se:0,marcados:0,total:0});
  const repSP={},repSE={};
  const reg=(rep,p,setor,id)=>{const r=rep[p.codigo]=rep[p.codigo]||{codigo:p.codigo,desc:p.desc,setor:setor.nome,dias:new Set()};r.dias.add(id)};
  docs.forEach(doc=>{
    const produtos=flatten(doc),marc=doc.marcacoes||{},fin=doc.finalizacoes||{};
    SETORES.forEach(setor=>{
      const doSetor=produtos.filter(p=>setor.deptos.includes(Number(p.deptoCodigo)));
      if(!doSetor.length)return;
      const r=porSetor[setor.usuario];
      r.dias++;r.total+=doSetor.length;
      doSetor.forEach(p=>{
        const m=marc[p.codigo];if(!m)return;
        r.marcados++;
        if(m.status==='ok')r.ok++;
        if(m.status==='sp'){r.sp++;reg(repSP,p,setor,doc.id)}
        if(m.status==='se'){r.se++;reg(repSE,p,setor,doc.id)}
      });
      const f=fin[setor.usuario];
      if(f){r.finalizou++;if(doc.importadoEm&&f.quando>=doc.importadoEm)r.tempos.push(f.quando-doc.importadoEm)}
    });
  });
  const top=rep=>Object.values(rep).map(r=>({...r,n:r.dias.size})).filter(r=>r.n>=2).sort((a,b)=>b.n-a.n).slice(0,10);
  return{porSetor:Object.values(porSetor).filter(r=>r.dias>0),topSP:top(repSP),topSE:top(repSE)};
}
function abrirHistorico(){
  const dias=Number($('#hist-dias').value);
  if(historicoCache.chave!==dataSelecionada+'|'+dias)carregarHistorico(dias);
}
async function carregarHistorico(dias){
  const el=$('#adm-historico-corpo');el.innerHTML='<p class="hint">Carregando '+dias+' dias...</p>';
  const base=new Date(dataSelecionada+'T00:00:00'),ids=[];
  for(let i=0;i<dias;i++){const d=new Date(base);d.setDate(d.getDate()-i);ids.push(isoDe(d))}
  try{
    const snaps=await Promise.all(ids.map(id=>COL.doc(id).get().catch(()=>null)));
    const docs=snaps.map((sn,i)=>sn&&sn.exists?{id:ids[i],...sn.data()}:null).filter(Boolean);
    historicoCache={chave:dataSelecionada+'|'+dias,dias,docs,ids};
    renderHistorico();
  }catch(e){el.innerHTML='<p class="hint" style="color:var(--red);">Não consegui carregar o histórico.</p>'}
}
function renderHistorico(){
  const el=$('#adm-historico-corpo'),{dias,docs,ids}=historicoCache;
  if(!docs||!docs.length){el.innerHTML='<p class="empty">Nenhum relatório publicado nesse período.</p>';return}
  const h=calcularHistorico(docs);
  const pct=(n,d)=>d?Math.round(n/d*100)+'%':'—';
  const media=r=>r.tempos.length?r.tempos.reduce((a,b)=>a+b,0)/r.tempos.length:null;
  const comTempo=h.porSetor.filter(r=>media(r)!==null).sort((a,b)=>media(b)-media(a));
  const comProb=h.porSetor.filter(r=>r.marcados).map(r=>({r,taxa:(r.sp+r.se)/r.marcados})).sort((a,b)=>b.taxa-a.taxa);
  let insights='';
  if(comTempo.length>1)insights+=`<div class="insight">🐢 <b>${esc(comTempo[0].setor.nome)}</b> é o setor que mais demora para finalizar (média de ${fmtDur(media(comTempo[0]))} depois da publicação).</div>`;
  if(comProb.length&&comProb[0].taxa>0)insights+=`<div class="insight">⚠️ <b>${esc(comProb[0].r.setor.nome)}</b> tem a maior taxa de problemas: ${Math.round(comProb[0].taxa*100)}% dos produtos conferidos ficaram sem placa ou sem estoque.</div>`;
  const linhas=h.porSetor.map(r=>{
    const m=media(r);
    const mn=r.tempos.length?fmtDur(Math.min(...r.tempos)):'—',mx=r.tempos.length?fmtDur(Math.max(...r.tempos)):'—';
    return `<tr><td><b>${esc(r.setor.nome)}</b><small>${r.dias} dia(s) com relatório</small></td>
      <td>${r.finalizou}/${r.dias}</td>
      <td>${m!==null?'<b>'+fmtDur(m)+'</b>':'—'}<small>${r.tempos.length?mn+' a '+mx:''}</small></td>
      <td style="color:var(--green);font-weight:700;">${pct(r.ok,r.marcados)}</td>
      <td style="color:var(--red);font-weight:700;">${pct(r.sp,r.marcados)}</td>
      <td style="color:var(--amber);font-weight:700;">${pct(r.se,r.marcados)}</td></tr>`;
  }).join('');
  const lista=(arr,vazio,classeTag)=>arr.length?arr.map(p=>`<div class="pend-row"><div class="info"><b>${esc(p.desc)}</b><span class="meta">${p.codigo} · ${esc(p.setor)}</span></div><span class="tag ${classeTag}">${p.n} de ${docs.length} dias</span></div>`).join(''):`<p class="hint">${vazio}</p>`;
  el.innerHTML=`<p class="hint">${docs.length} relatório(s) publicado(s) de ${dataBR(ids[ids.length-1])} a ${dataBR(ids[0])}.</p>
  ${insights}
  <h2 class="sec">Por setor</h2>
  <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Setor</th><th>Finalizou</th><th>Tempo médio até finalizar</th><th>OK</th><th>Sem placa</th><th>Sem estoque</th></tr></thead><tbody>${linhas}</tbody></table></div>
  <p class="hint" style="margin-top:6px;">Tempo contado da publicação do relatório até o encarregado apertar "Finalizar". Porcentagens sobre os produtos conferidos.</p>
  <h2 class="sec">Produtos que mais ficaram sem placa</h2>
  ${lista(h.topSP,'Nenhum produto ficou sem placa em mais de um dia nesse período.','rej')}
  <h2 class="sec">Produtos que mais ficaram sem estoque</h2>
  ${lista(h.topSE,'Nenhum produto ficou sem estoque em mais de um dia nesse período.','')}`;
}
async function processarPdfsAdmin(){
  const input=$('#adm-arquivos'),files=[...(input.files||[])];
  if(!files.length){toast('Selecione ao menos um PDF');return}
  const btn=$('#adm-processar');btn.disabled=true;btn.textContent='Processando...';
  const resultados=[];nomesArquivosFalha=[];
  for(const f of files){
    try{const linhas=await linhasDoPDF(f);resultados.push(parseLinhas(linhas))}
    catch(e){nomesArquivosFalha.push(f.name)}
  }
  catalogoImportado=mesclarCatalogos(resultados);
  btn.disabled=false;btn.textContent='Processar PDFs';
  renderPreview();
}
function renderPreview(){
  const el=$('#adm-preview');if(!catalogoImportado){el.innerHTML='';return}
  const deps=Object.values(catalogoImportado).sort((a,b)=>a.nome.localeCompare(b.nome));
  const total=contarCatalogo(catalogoImportado);
  el.innerHTML=`<h2 class="sec">Resumo do que foi lido</h2>
  ${deps.map(d=>{const n=Object.values(d.secoes).reduce((s,sec)=>s+sec.produtos.length,0);return `<div class="preview-depto"><span>${esc(d.nome)}</span><b>${n} produto(s)</b></div>`}).join('')}
  <p style="margin:10px 0;"><b>Total: ${total} produtos</b></p>
  ${nomesArquivosFalha.length?`<p class="hint" style="color:var(--red);">Não consegui ler: ${nomesArquivosFalha.join(', ')}. Tente importar esses de novo.</p>`:''}
  <button class="primary" id="adm-publicar">Publicar relatório de ${dataBR(dataSelecionada)}</button>
  <p class="hint" style="margin-top:8px;">Isso envia a lista para os encarregados marcarem. Marcações já feitas nesse dia não são apagadas.</p>`;
  $('#adm-publicar').onclick=publicarCatalogo;
}
async function publicarCatalogo(){
  try{
    // olha o relatório do dia anterior: produtos cuja promoção terminava exatamente ontem
    // (não depende de o produto ainda aparecer ou não no PDF de hoje — o que importa é a data de fim)
    let saidas=[];
    const dataOntemDiag=dataAnteriorStr(dataSelecionada);
    let saidasInfo={dataOntem:dataOntemDiag,ontemExiste:false,produtosOntem:0,terminavamOntem:0};
    try{
      const dataOntem=dataOntemDiag,fimOntemBR=dataBR(dataOntem);
      const snapOntem=await COL.doc(dataOntem).get();
      if(snapOntem.exists){
        const prodOntem=flatten(snapOntem.data());
        saidasInfo.ontemExiste=true;saidasInfo.produtosOntem=prodOntem.length;
        saidasInfo.terminavamOntem=prodOntem.filter(p=>p.fim===fimOntemBR).length;
        const fimHojePorCodigo=new Map();
        Object.values(catalogoImportado).forEach(d=>Object.values(d.secoes).forEach(s=>s.produtos.forEach(p=>fimHojePorCodigo.set(p.codigo,p.fim))));
        saidas=prodOntem.filter(p=>{
          if(p.fim!==fimOntemBR)return false; // só quem terminava ontem
          const fimHoje=fimHojePorCodigo.get(p.codigo);
          if(fimHoje&&fimHoje!==p.fim)return false; // ganhou um novo período de promoção, não precisa retirar
          return true;
        }).map(p=>({codigo:p.codigo,desc:p.desc,deptoCodigo:p.deptoCodigo,deptoNome:p.deptoNome,fim:p.fim}));
      }
    }catch(e){}
    await COL.doc(dataSelecionada).set({catalogo:{deptos:catalogoImportado},importadoEm:Date.now(),importadoPor:sessao.nome,saidas,saidasInfo},{merge:true});
    toast('Relatório publicado!'+(saidas.length?` ${saidas.length} produto(s) com placa para retirar.`:''));
    catalogoImportado=null;$('#adm-preview').innerHTML='';$('#adm-arquivos').value='';
    carregarDashboardAdmin();
  }catch(e){toast('Erro ao publicar')}
}

function hhmm(ts){return new Date(ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}
function blocoPlacasAdmin(doc){
  const saidas=doc.saidas,info=doc.saidasInfo,pr=doc.placaRetirada||{},fr=doc.retiradaFinalizada||{};
  let corpo;
  if(saidas===undefined){
    corpo='<p class="hint">Este relatório foi publicado antes da função de retirada de placas. <b>Importe e publique de novo</b> os PDFs desta data para calcular.</p>';
  }else{
    const ontemBR=info?dataBR(info.dataOntem):dataBR(dataAnteriorStr(dataSelecionada));
    let diag='';
    if(info&&!info.ontemExiste)diag=`<p class="hint" style="color:var(--red);">⚠️ Não encontrei nenhum relatório publicado em <b>${ontemBR}</b>. Importe e publique os PDFs de ${ontemBR} (escolhendo essa data) e depois publique este dia de novo.</p>`;
    else if(info)diag=`<p class="hint">Relatório de ${ontemBR} encontrado: ${info.produtosOntem} produtos, <b>${info.terminavamOntem}</b> com promoção terminando em ${ontemBR}.</p>`;
    const retiradas=saidas.filter(p=>pr[p.codigo]).length;
    const porSetor=SETORES.map(s=>{
      const itens=saidas.filter(p=>s.deptos.includes(Number(p.deptoCodigo)));
      return{setor:s,itens,ret:itens.filter(p=>pr[p.codigo]).length,fin:fr[s.usuario]};
    }).filter(x=>x.itens.length);
    corpo=`${diag}
    <p style="margin:6px 0;"><b>${retiradas} de ${saidas.length}</b> placas já retiradas.</p>
    ${porSetor.map(x=>`<div class="preview-depto"><span>${esc(x.setor.nome)}</span><span><b>${x.ret}/${x.itens.length}</b> ${x.fin?`<span class="tag ok" style="margin-left:6px;">FINALIZADO ÀS ${hhmm(x.fin.quando)}</span> <button class="secondary" style="padding:3px 9px;font-size:.68rem;" onclick="verFotosRetirada('${x.setor.usuario}')">📷 Ver fotos</button>`:''}</span></div>`).join('')}
    ${saidas.length?`<button class="secondary" style="margin-top:10px;" onclick="alternarSaidas()">${saidasAbertas?'Ocultar lista':'Ver lista completa'}</button>`:''}
    ${saidasAbertas?saidas.map(p=>`<div class="pend-row"><div class="info"><b>${esc(p.desc)}</b><span class="meta">${p.codigo} · ${esc(p.deptoNome)} · terminou em ${p.fim}</span></div>${pr[p.codigo]?'<span class="tag ok">RETIRADA ✓</span>':'<span class="tag">PENDENTE</span>'}</div>`).join(''):''}`;
  }
  return `<div class="card" style="margin-top:14px;background:var(--paper);"><h2>📌 PLACAS PARA RETIRAR (promoções que terminaram ontem)</h2>${corpo}</div>`;
}

async function resolverPendencia(codigo,tipo,btn){
  if(btn)btn.disabled=true; // evita clique duplo marcando o mesmo item duas vezes
  if(tipo==='sp'&&Math.random()<0.35){abrirModalFotoResolucao(codigo,btn);return}
  await finalizarResolucao(codigo,btn,null,tipo);
}
async function finalizarResolucao(codigo,btn,fotoB64,tipo){
  try{
    await COL.doc(dataSelecionada).update({[`marcacoes.${codigo}.resolvido`]:true,[`marcacoes.${codigo}.resolvidoEm`]:Date.now(),[`marcacoes.${codigo}.resolvidoPor`]:sessao.nome});
    if(fotoB64){try{await FOTOS.doc(`${dataSelecionada}_res_${codigo}`).set({data:dataSelecionada,codigo,foto:fotoB64,resolvidoPor:sessao.nome,quando:Date.now()})}catch(e){}}
    if(ultimoDocAdmin){ultimoDocAdmin.marcacoes=ultimoDocAdmin.marcacoes||{};ultimoDocAdmin.marcacoes[codigo]={...(ultimoDocAdmin.marcacoes[codigo]||{}),resolvido:true};}
    // troca só essa linha, sem redesenhar a tela toda — evita o "pulo" de tela
    const linha=document.getElementById('pend-'+codigo);
    if(linha){const acao=linha.querySelector('button');if(acao){const tag=document.createElement('span');tag.className='tag ok';tag.textContent='RESOLVIDO ✓';acao.replaceWith(tag)}}
    toast('Marcado como resolvido');
    if(tipo==='se')checarFechamentoEstoque();
  }catch(e){toast('Erro ao salvar');if(btn)btn.disabled=false}
}
function checarFechamentoEstoque(){
  // só redesenha a aba de estoque quando não sobrar nenhuma pendência — pra não causar o "pulo" de tela a cada clique
  const doc=ultimoDocAdmin;if(!doc)return;
  const produtos=flatten(doc),marc=doc.marcacoes||{};

  const pendentes=todosSE.filter(p=>!marc[p.codigo].resolvido);

}

    toast('Marcado!');
    if(ultimoDocSetor){ultimoDocSetor.placaRetirada=ultimoDocSetor.placaRetirada||{};ultimoDocSetor.placaRetirada[codigo]={quando:Date.now(),setor:sessao.setor.nome};}
    const tab=$('#tab-retirar-placas');
    if(tab){const pend=saidasDoSetor(ultimoDocSetor).filter(p=>!p.retirada).length;tab.textContent='📌 Retirar placas'+(pend?' ('+pend+')':'');}
    const blocoFin=$('#retirada-finalizar');if(blocoFin&&ultimoDocSetor)blocoFin.innerHTML=blocoFinalizarRetirada(ultimoDocSetor);
  }catch(e){toast('Erro ao salvar');if(btn)btn.disabled=false}
}
function abrirModalSaidas(pend){
  abrir(`<h2>📌 Produtos que saíram da promoção</h2><p class="hint">Retire a placa desses produtos na gôndola. A lista completa fica na aba "Retirar placas".</p>
  ${pend.map(p=>`<div class="pend-row"><div class="info"><b>${esc(p.desc)}</b><span class="meta">${p.codigo} · promoção terminou em ${p.fim}</span></div></div>`).join('')}
  <div class="row"><button class="primary" onclick="fechar();mudarViewSetor('retirar')">Ver lista</button><button class="secondary" onclick="fechar()">Fechar</button></div>`);
}
function renderSetor(doc,data){
  const todos=flatten(doc).filter(p=>sessao.setor.deptos.includes(Number(p.deptoCodigo)));
  const marc=doc.marcacoes||{};
  const marcados=todos.filter(p=>marc[p.codigo]).length;
  ultimoTodosSetor=todos;ultimoMarcadosSetor=marcados;ultimaDataSetor=data;ultimoDocSetor=doc;
  const fin=(doc.finalizacoes||{})[sessao.setor.usuario];
  $('#setor-progresso').innerHTML=`<div class="barra-bg"><div class="barra-fill" style="width:${todos.length?Math.round(marcados/todos.length*100):0}%"></div></div><p class="hint">${marcados} de ${todos.length} produtos já conferidos.</p>
  ${fin?`<p class="tag ok">✅ Setor finalizado às ${new Date(fin.quando).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})} <a href="#" onclick="event.preventDefault();desfazerFinalizacao()" style="margin-left:8px;font-size:.68rem;color:inherit;">(reabrir)</a></p>`
     :`<button class="primary" onclick="finalizarSetorAtual()">✅ Finalizar conferência do setor</button>`}`;
  const saidas=saidasDoSetor(doc),pendSaidas=saidas.filter(p=>!p.retirada);
  const tab=$('#tab-retirar-placas');
  if(tab)tab.textContent='📌 Retirar placas'+(pendSaidas.length?' ('+pendSaidas.length+')':'');
  const conteudoRetirar=$('#setor-retirar-conteudo');
  if(conteudoRetirar){
    conteudoRetirar.innerHTML=saidas.length?`<h2>PRODUTOS PARA RETIRAR A PLACA</h2>
    <p class="hint">Essas promoções terminaram ontem. Retire a placa da gôndola e marque abaixo.</p>
    ${saidas.map(p=>`<div class="pend-row" id="saida-${p.codigo}">
      <div class="info"><b>${esc(p.desc)}</b><span class="meta">${p.codigo} · ${esc(p.deptoNome)} · promoção terminou em ${p.fim}</span></div>
      ${p.retirada?'<span class="tag ok">PLACA RETIRADA ✓</span>':`<button class="secondary" onclick="marcarPlacaRetirada('${data}','${p.codigo}',this)">Marcar como placa retirada</button>`}
    </div>`).join('')}
    <div id="retirada-finalizar" style="margin-top:16px;">${blocoFinalizarRetirada(doc)}</div>`:'<h2>PRODUTOS PARA RETIRAR A PLACA</h2><p class="empty">Nenhuma promoção terminou ontem para este setor.</p>';
  }
  if(pendSaidas.length&&!avisoSaidasMostrado){avisoSaidasMostrado=true;abrirModalSaidas(pendSaidas)}
  const porDepto={};
  todos.forEach(p=>{(porDepto[p.deptoNome]=porDepto[p.deptoNome]||{})[p.secaoNome]=(porDepto[p.deptoNome][p.secaoNome]||[]).concat([p])});
  const L=$('#setor-lista');
  if(!todos.length){L.innerHTML='<div class="card"><p class="empty">Nenhum produto em promoção hoje para este setor.</p></div>';return}
  L.innerHTML=Object.keys(porDepto).sort().map(dep=>{
    const secoes=porDepto[dep];
    return `<div class="card" style="margin-bottom:14px;"><div class="depto-head">${esc(dep)}</div>
    ${Object.keys(secoes).sort().map(sec=>`<div class="secao-head">${sec==='Geral'?'':esc(sec)}</div>
      ${secoes[sec].map(p=>{
        const m=marc[p.codigo],st=m?m.status:null;
        return `<div class="prod-block"><div class="prod-row"><div class="prod-info"><div class="cod">${p.codigo}</div><div class="desc">${esc(p.desc)}</div>
        <div class="preco">R$ ${p.precoEspecial.toFixed(2)} <span class="periodo">(${p.inicio} a ${p.fim}) · Estoque: <b>${p.estoque!==undefined?p.estoque:'—'}</b> · Saída (10d): <b>${p.saida10!==undefined?p.saida10:'—'}</b></span></div></div>
        <div class="marc-btns">
          <button class="${st==='ok'?'on-ok':''}" onclick="marcar('${data}','${p.codigo}','ok')">OK</button>
          <button class="${st==='sp'?'on-sp':''}" onclick="marcar('${data}','${p.codigo}','sp')">SP</button>
          <button class="${st==='se'?'on-se':''}" onclick="marcar('${data}','${p.codigo}','se')">SE</button>
        </div></div>
        <div class="obs-row"><input type="text" placeholder="Observação (ex.: tem placa, mas só uma; preço errado...)" value="${esc(m&&m.obs?m.obs:'')}" oninput="obsAlterada('${data}','${p.codigo}',this.value)"></div>
        </div>`;
      }).join('')}`).join('')}
    </div>`;
  }).join('');
}
async function marcar(data,codigo,status){
  try{await COL.doc(data).update({
    [`marcacoes.${codigo}.status`]:status,
    [`marcacoes.${codigo}.setor`]:sessao.setor.nome,
    [`marcacoes.${codigo}.quando`]:Date.now(),
    [`marcacoes.${codigo}.resolvido`]:false
  })}catch(e){toast('Erro ao salvar marcação')}
}
let obsTimers={};
function obsAlterada(data,codigo,valor){
  clearTimeout(obsTimers[codigo]);
  obsTimers[codigo]=setTimeout(()=>salvarObs(data,codigo,valor),600);
}
async function salvarObs(data,codigo,valor){
  try{await COL.doc(data).update({[`marcacoes.${codigo}.obs`]:valor})}catch(e){toast('Erro ao salvar observação')}
}
async function finalizarSetorAtual(){
  if(ultimoMarcadosSetor<ultimoTodosSetor.length){
    if(!confirm(`Ainda faltam ${ultimoTodosSetor.length-ultimoMarcadosSetor} produto(s) sem marcação. Finalizar mesmo assim?`))return;
  }
  const marc=(ultimoDocSetor&&ultimoDocSetor.marcacoes)||{};
  const okDoSetor=ultimoTodosSetor.filter(p=>marc[p.codigo]&&marc[p.codigo].status==='ok');
  if(!okDoSetor.length){ // nenhum produto OK pra fotografar, finaliza direto
    try{await COL.doc(ultimaDataSetor).update({[`finalizacoes.${sessao.setor.usuario}`]:{quando:Date.now(),nome:sessao.setor.nome,fotos:false}});toast('Setor finalizado!')}
    catch(e){toast('Erro ao finalizar')}
    return;
  }
  const n=Math.min(3,okDoSetor.length);
  const sorteados=[...okDoSetor].sort(()=>Math.random()-0.5).slice(0,n);
  abrirModalFinalizar(sorteados);
}
let fotosPendentes=[],fotosCapturadas={};
function abrirModalFinalizar(sorteados){
  fotosPendentes=sorteados;fotosCapturadas={};
  abrir(`<h2>Registrar fotos para finalizar</h2>
  <p class="hint">Tire uma foto de cada produto abaixo, mostrando a placa de promoção na gôndola.</p>
  <div id="fotos-lista">${sorteados.map(p=>`<div class="foto-item" id="foto-item-${p.codigo}">
    <div class="prod-info"><div class="cod">${p.codigo}</div><div class="desc">${esc(p.desc)}</div></div>
    <input type="file" accept="image/*" capture="environment" onchange="capturarFoto('${p.codigo}',this)">
    <span class="foto-status" id="foto-status-${p.codigo}">Pendente</span>
  </div>`).join('')}</div>
  <div class="row"><button class="primary" id="btn-confirmar-fotos" disabled>Confirmar finalização</button><button class="secondary" onclick="fechar()">Cancelar</button></div>`);
  $('#btn-confirmar-fotos').onclick=confirmarFinalizacaoComFotos;
}
async function capturarFoto(codigo,input){
  const file=input.files[0];if(!file)return;
  const st=$('#foto-status-'+codigo);st.textContent='Processando...';
  try{fotosCapturadas[codigo]=await comprimirImagem(file);st.textContent='✅ Registrada';atualizarBotaoConfirmarFotos()}
  catch(e){st.textContent='Erro, tente de novo'}
}
function atualizarBotaoConfirmarFotos(){
  const btn=$('#btn-confirmar-fotos');if(btn)btn.disabled=!fotosPendentes.every(p=>fotosCapturadas[p.codigo]);
}
async function confirmarFinalizacaoComFotos(){
  const btn=$('#btn-confirmar-fotos');btn.disabled=true;btn.textContent='Enviando...';
  try{
    const fotosArr=fotosPendentes.map(p=>({codigo:p.codigo,desc:p.desc,foto:fotosCapturadas[p.codigo]}));
    await FOTOS.doc(`${ultimaDataSetor}_${sessao.setor.usuario}`).set({data:ultimaDataSetor,setor:sessao.setor.nome,setorUsuario:sessao.setor.usuario,fotos:fotosArr,criado:Date.now()});
    await COL.doc(ultimaDataSetor).update({[`finalizacoes.${sessao.setor.usuario}`]:{quando:Date.now(),nome:sessao.setor.nome,fotos:true}});
    toast('Setor finalizado!');fechar();
  }catch(e){toast('Erro ao finalizar');btn.disabled=false;btn.textContent='Confirmar finalização'}
}
async function desfazerFinalizacao(){
  try{await COL.doc(ultimaDataSetor).update({[`finalizacoes.${sessao.setor.usuario}`]:firebase.firestore.FieldValue.delete()})}
  catch(e){toast('Erro ao reabrir')}
}

/* ===== Início ===== */
(()=>{
  const salvo=sessionStorage.getItem('promo-sessao');
  if(salvo){try{entrar(JSON.parse(salvo));return}catch(e){}}
  $('#login-screen').style.display='block';
})();
</script>
<script id="padrao-superville-js">
/* =====================================================================
   PADRÃO SUPERVILLE — complementos de tela (não altera a lógica do sistema)
   - Tabelas viram cartões no celular (rótulo de cada coluna em cada linha)
   - Cabeçalho de relatório com logo + botão "Imprimir / Salvar PDF"
   - Rodapé "Gerado em" na impressão
   ===================================================================== */
(function(){
  function agora(){return new Date().toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).replace(',',' às');}
  function logoSrc(){var i=document.querySelector('img.brand-logo[src^="data:"],img#logo[src^="data:"],img.logo[src^="data:"],#header-logo[src^="data:"],img[src^="data:image/jpeg"]');return i?i.src:'';}

  // 1) Tabelas responsivas: copia o título da coluna para cada célula
  function rotularTabelas(){
    document.querySelectorAll('table').forEach(function(t){
      var ths=t.querySelectorAll('thead th');if(!ths.length)return;
      t.classList.add('sv-rt');
      var nomes=[].map.call(ths,function(th){return th.textContent.trim();});
      t.querySelectorAll('tbody tr').forEach(function(tr){
        var c=0;[].forEach.call(tr.children,function(td){
          if(td.getAttribute('data-label')==null)td.setAttribute('data-label',nomes[c]||'');
          c+=parseInt(td.getAttribute('colspan')||'1',10);
        });
      });
    });
  }

  // 2) Impressão de um relatório específico
  function cabecalhoImpressao(titulo,sub){
    var h=document.querySelector('.sv-print-head');
    if(!h){h=document.createElement('div');h.className='sv-print-head';document.body.insertBefore(h,document.body.firstChild);}
    var src=logoSrc();
    h.innerHTML=(src?'<img alt="SuperVille" src="'+src+'">':'')+'<div><b></b><span></span></div>';
    h.querySelector('b').textContent=titulo;
    h.querySelector('span').textContent=(sub?sub+'  ·  ':'')+'SuperVille Supermercado · Gerado em '+agora();
  }
  function imprimir(area,titulo,sub){
    document.body.setAttribute('data-sv-gerado',agora());
    cabecalhoImpressao(titulo,sub);
    var root=document.getElementById('sv-print-root');
    if(!root){root=document.createElement('div');root.id='sv-print-root';document.body.appendChild(root);}
    root.innerHTML='';var clone=area.cloneNode(true);
    clone.querySelectorAll('button,.sv-print-bar,.rel-header').forEach(function(b){b.remove();});
    clone.style.display='block';root.appendChild(clone);
    document.body.classList.add('sv-printing');
    setTimeout(function(){window.print();},50);
  }
  window.addEventListener('afterprint',function(){document.body.classList.remove('sv-printing');});
  window.addEventListener('beforeprint',function(){document.body.setAttribute('data-sv-gerado',agora());rotularTabelas();});

  function botao(rotulo){var b=document.createElement('button');b.type='button';b.className='sv-print-btn';b.textContent='🖨️ '+(rotulo||'Imprimir / Salvar PDF');return b;}

  // Relatório do Café (?relatorio= / ?historicoCompleto): logo + botão no cabeçalho + rodapé
  function montarRelatorioCafe(){
    var rh=document.querySelector('#app-relatorio .rel-header');if(!rh||rh.dataset.sv)return;rh.dataset.sv='1';
    var h1=rh.querySelector('h1'),p=rh.querySelector('p');
    var top=document.createElement('div');top.className='sv-rel-top';
    var brand=document.createElement('div');brand.className='brand';
    var img=document.createElement('img');img.className='sv-rel-logo';img.alt='SuperVille Supermercado';img.src=logoSrc();
    var txt=document.createElement('div');txt.appendChild(h1);txt.appendChild(p);
    brand.appendChild(img);brand.appendChild(txt);top.appendChild(brand);
    var b=botao();b.onclick=function(){imprimir(document.getElementById('app-relatorio'),(h1.textContent||'Relatório').replace(/^[^\wÀ-ú]+/,''),p.textContent);};
    top.appendChild(b);rh.appendChild(top);
    var rod=document.createElement('p');rod.className='sv-rodape';
    rod.innerHTML='<b>SuperVille Supermercado</b> · Relatório gerado em '+agora();
    document.getElementById('app-relatorio').appendChild(rod);
  }

  // Outros relatórios: barra com botão no topo do painel
  var PAINEIS=[
    ['#panel-estatisticas','Estatísticas de Café'],   // Admin
    ['#view-stats','Estatísticas do Recrutamento'],    // Recrutamento
    ['#adm-dashboard','Painel de Promoções do Dia'],   // Promoções (admin)
    ['#adm-historico-corpo','Histórico de Promoções'],  // Promoções (admin) — histórico
    ['#adm-estoque','Promoções — Produtos sem estoque'] // Promoções (admin) — sem estoque
  ];
  var USA_PAI={'#adm-dashboard':1,'#adm-historico-corpo':1,'#adm-estoque':1};
  function montarPaineis(){
    PAINEIS.forEach(function(cfg){
      var el=document.querySelector(cfg[0]);if(!el)return;
      var alvo=USA_PAI[cfg[0]]?el.parentElement:el;
      if(!alvo||alvo.querySelector(':scope > .sv-print-bar'))return;
      var bar=document.createElement('div');bar.className='sv-print-bar';
      var b=botao();b.onclick=function(){
        var t=cfg[1];var lbl=document.getElementById('adm-data-label');if(lbl&&USA_PAI[cfg[0]])t+=' — '+lbl.textContent;
        imprimir(alvo,t);};
      bar.appendChild(b);alvo.insertBefore(bar,alvo.firstChild);
    });
  }

  var agendado=false;
  function atualizar(){agendado=false;rotularTabelas();montarRelatorioCafe();montarPaineis();}
  function agendar(){if(!agendado){agendado=true;requestAnimationFrame(atualizar);}}
  function iniciar(){document.body.setAttribute('data-sv-gerado',agora());atualizar();
    new MutationObserver(function(ms){for(var i=0;i<ms.length;i++){var n=ms[i].target;if(n.closest&&n.closest('#sv-print-root,.sv-print-head'))continue;agendar();return;}})
      .observe(document.body,{childList:true,subtree:true});}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',iniciar);else iniciar();
})();
</script>
