<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recrutamento — Superville</title>
<style>
  :root{--ink:#1c2438;--ink-soft:#4a5474;--paper:#eef0f4;--paper-line:#d7dbe4;--card:#fff;--navy:#1f6b45;--navy-deep:#14432c;--amber:#c47f2c;--amber-bg:#fbf1e2;--red:#a8342a;--red-bg:#fbe9e6;--green:#2f6b4f;--green-bg:#e7f2ec;
    --mono:'Courier New',ui-monospace,Menlo,monospace;--sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--sans);background:repeating-linear-gradient(var(--paper),var(--paper) 27px,var(--paper-line) 28px),var(--paper);color:var(--ink);min-height:100vh;padding-bottom:60px;}
  header{background:var(--navy);color:#fff;padding:22px 24px 20px;border-bottom:6px solid var(--navy-deep);}
  header h1{margin:0;font-size:1.4rem;letter-spacing:.03em;font-family:var(--mono);font-weight:700;}
  header p{margin:6px 0 0;color:#c3cbe0;font-size:.85rem;}
  .brand{display:flex;align-items:center;gap:14px;}
  .brand-logo{width:52px;height:52px;border-radius:12px;object-fit:cover;flex-shrink:0;}
  .tabs{max-width:960px;margin:18px auto 0;padding:0 16px;display:flex;gap:6px;flex-wrap:wrap;}
  .tab{padding:10px 16px;background:transparent;border:none;border-bottom:3px solid transparent;font-family:var(--sans);font-weight:600;font-size:.88rem;color:var(--ink-soft);cursor:pointer;text-decoration:none;display:inline-block;}
  .tab.active{color:var(--navy);border-bottom-color:var(--amber);}
  main{max-width:960px;margin:14px auto 0;padding:0 16px;}
  .card{background:var(--card);border:1px solid var(--paper-line);border-radius:10px;padding:22px;box-shadow:0 1px 2px rgba(23,32,58,.05);}
  h2{font-size:1rem;margin:0 0 16px;color:var(--navy);font-family:var(--mono);}
  h2.sec{margin:26px 0 12px;text-transform:uppercase;letter-spacing:.05em;}
  label{display:block;font-size:.75rem;font-weight:600;color:var(--ink-soft);margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em;}
  input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--paper-line);border-radius:6px;font-size:.92rem;font-family:var(--sans);color:var(--ink);background:#fff;}
  textarea{min-height:70px;resize:vertical;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--amber);outline-offset:1px;}
  .fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;}
  .full{grid-column:1/-1;}
  .fs{grid-column:1/-1;font:700 .75rem var(--mono);color:var(--navy);text-transform:uppercase;letter-spacing:.08em;margin-top:8px;border-bottom:1px dashed var(--paper-line);padding-bottom:4px;}
  .hint{font-size:.72rem;color:var(--ink-soft);margin-top:4px;}
  button{font-family:var(--sans);}
  button.primary{background:var(--navy);color:#fff;border:none;padding:11px 22px;border-radius:6px;font-weight:600;font-size:.88rem;cursor:pointer;}
  button.primary:hover{background:var(--navy-deep);}
  button.secondary{background:#fff;color:var(--navy);border:1px solid var(--navy);padding:8px 14px;border-radius:6px;font-weight:600;font-size:.8rem;cursor:pointer;}
  button.danger{background:#fff;color:var(--red);border:1px solid var(--red);padding:8px 14px;border-radius:6px;font-weight:600;font-size:.8rem;cursor:pointer;}
  .empty{color:var(--ink-soft);padding:20px 4px;font-size:.9rem;}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
  .cd{background:#fff;border:1px solid var(--paper-line);border-radius:12px;padding:16px;cursor:pointer;}
  .cd:hover{border-color:var(--navy);} .cd.old{opacity:.65;}
  .cd .n{font:400 .7rem var(--mono);letter-spacing:.12em;color:var(--ink-soft);}
  .cd h3{margin:6px 0 8px;font:700 1.1rem/1.2 var(--mono);color:var(--navy);}
  .cd p{margin:3px 0;font-size:.85rem;} .m{color:var(--ink-soft);}
  .cd hr{border:0;border-top:1px dashed var(--paper-line);margin:12px 0 8px;}
  .lb{font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);}
  .big{font:700 1.25rem var(--mono);color:var(--navy);}
  .tag{display:inline-block;font:700 .65rem var(--mono);letter-spacing:.05em;padding:3px 8px;border-radius:4px;margin-top:8px;color:var(--amber);background:var(--amber-bg);border:1px solid currentColor;}
  .tag.ok{color:var(--green);background:var(--green-bg);}
  .ov{position:fixed;inset:0;background:rgba(10,20,15,.6);display:none;align-items:center;justify-content:center;padding:14px;z-index:9;}
  .ov.on{display:flex;}
  .md{background:#fff;border-radius:12px;max-width:540px;width:100%;max-height:92%;overflow:auto;padding:22px;}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
  table{width:100%;border-collapse:collapse;font-size:.85rem;} td{padding:7px 4px;border-bottom:1px dashed var(--paper-line);vertical-align:top;}
  td:first-child{color:var(--ink-soft);width:42%;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy-deep);color:#fff;padding:11px 20px;border-radius:8px;font-size:.85rem;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20;}
  .toast.show{opacity:1;}
  #login-screen{max-width:380px;margin:80px auto;padding:0 16px;}
  #login-screen h2{text-align:center;font-size:1.1rem;}
  .erro-login{color:var(--red);font-size:.8rem;margin-top:10px;text-align:center;display:none;}
</style>
</head>
<body>

<div id="login-screen" style="display:none;">
  <div class="card">
    <div class="brand" style="justify-content:center;margin-bottom:18px;"><img class="brand-logo" alt="Superville"></div>
    <h2>RECRUTAMENTO</h2>
    <form id="form-login">
      <div style="margin-bottom:14px;"><label>Usuário</label><input id="login-usuario" required placeholder="Seu nome de usuário"></div>
      <div><label>Senha</label><input id="login-senha" type="password" required placeholder="Senha"></div>
      <div style="margin-top:20px;"><button type="submit" class="primary" style="width:100%;">Entrar</button></div>
      <p class="erro-login" id="erro-login">Usuário ou senha incorretos.</p>
    </form>
  </div>
</div>

<div id="app" style="display:none;">
  <header><div class="brand"><img class="brand-logo" alt="Superville"><div><h1>👥 RECRUTAMENTO</h1><p>Logado como <b id="usuario-logado"></b></p></div></div></header>
  <div class="tabs">
    <a href="controle-chaves.html" class="tab">🔑 Chaves</a>
    <a href="controle-cafe.html" class="tab">☕ Café</a>
    <button class="tab active">👥 Recrutamento</button>
    <a href="admin.html" class="tab">⚙️ Admin</a>
    <button class="tab" id="btn-sair" style="margin-left:auto;">Sair</button>
  </div>
  <main>
    <div class="card">
      <h2>MARCAR ENTREVISTA</h2>
      <form id="fm" class="fg">
        <div><label>Nome do candidato</label><input name="nome" required placeholder="Ex.: Vinicius Espindola"></div>
        <div><label>Telefone (com DDD)</label><input name="tel" type="tel" required placeholder="(11) 90000-0000"></div>
        <div><label>Vaga</label><input name="vaga" placeholder="Ex.: Hortifruti"></div>
        <div><label>Data</label><input name="data" type="date" required></div>
        <div><label>Horário</label><input name="hora" type="time" required></div>
        <div style="align-self:end;"><button class="primary" style="width:100%;">Marcar e gerar link</button></div>
      </form>
    </div>
    <div id="lista"></div>
  </main>
</div>

<div id="cand" style="display:none;">
  <header><div class="brand"><img class="brand-logo" alt="Superville"><div><h1>SUPERVILLE</h1><p>Ficha de pré-entrevista</p></div></div></header>
  <main id="cand-main"></main>
</div>

<div class="ov" id="ov"><div class="md" id="md"></div></div>
<div class="toast" id="toast"></div>

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}
function fmt(ts){const[d,t]=ts.split('T'),[y,m,dd]=d.split('-');return{d:dd+'/'+m,t}}
function abrir(h){$('#md').innerHTML=h;$('#ov').classList.add('on')}
function fechar(){$('#ov').classList.remove('on')}
$('#ov').onclick=e=>{if(e.target.id==='ov')fechar()};
function copiar(id,btn){const el=$('#'+id);el.select();try{document.execCommand('copy')}catch(e){}try{navigator.clipboard.writeText(el.value)}catch(e){}btn.textContent='Copiado ✓'}
function falta(ts){const m=Math.floor((new Date(ts)-Date.now())/6e4);if(m<0)return'Já passou';const d=Math.floor(m/1440),h=Math.floor(m%1440/60);return d?`${d}d ${h}h`:`${h}h ${m%60}min`}
function idade(n){if(!n)return'';const a=new Date(n),h=new Date();let i=h.getFullYear()-a.getFullYear();if(h<new Date(h.getFullYear(),a.getMonth(),a.getDate()))i--;return i+' anos'}
function mensagem(it){const f=fmt(it.ts);return`Olá, ${it.nome.split(' ')[0]}! Sua entrevista está marcada para o dia ${f.d} às ${f.t} no ${ENDERECO}. Para agilizar, preencha antes a sua ficha rápida neste link: ${BASE}?c=${it.id}`}

function campo([k,l,t,req,opt,cls]){let c;
  if(t==='sel')c=`<select name="${k}" ${req?'required':''}><option value="">Selecione</option>${opt.map(o=>`<option>${o}</option>`).join('')}</select>`;
  else if(t==='area')c=`<textarea name="${k}"></textarea>`;
  else c=`<input name="${k}" type="${t}" ${req?'required':''}>`;
  return`<div class="${cls||''}"><label>${l}${req?' *':''}</label>${c}</div>`}

function popupLink(it,novo){const f=fmt(it.ts),ph=(it.tel||'').replace(/\D/g,'');
  abrir(`<div class="lb">${novo?'Entrevista marcada ✓':'Link da ficha'}</div><h2 style="margin:6px 0 4px;font-size:1.15rem;">${esc(it.nome)}</h2>

  <label>Mensagem para o candidato</label><textarea id="tm" readonly style="min-height:120px;">${esc(mensagem(it))}</textarea>
  <div class="row"><button class="primary" onclick="copiar('tm',this)">Copiar mensagem</button>

function detalhe(id){const it=itens.find(x=>x.id===id);if(!it)return;const f=fmt(it.ts),fi=it.ficha;let r='';

  abrir(`<div class="lb">Nº ${pad(it.n||0)}</div><h2 style="margin:6px 0 4px;font-size:1.15rem;">${esc(it.nome)}</h2>
  <p style="margin:0 0 14px;">${esc(it.tel)}${it.vaga?' · '+esc(it.vaga):''}<br>Dia <b>${f.d}</b> às <b>${f.t}</b></p>
  <h2 class="sec" style="margin-top:8px;">Ficha de triagem</h2>
  ${fi?`<table>${r}</table>${it.cv?`<div class="row"><button class="secondary" onclick="baixarCV('${id}')">📎 Baixar currículo (${esc(it.cv.name)})</button></div>`:'<p class="hint">Sem currículo anexado.</p>'}`:'<p class="empty" style="padding:6px 0;">O candidato ainda não preencheu a ficha.</p>'}
  <div class="row"><button class="secondary" onclick="popupLink(itens.find(x=>x.id==='${id}'))">Ver link / mensagem</button><button class="danger" onclick="excluir('${id}')">Excluir</button><button class="secondary" onclick="fechar()">Fechar</button></div>`)}
function baixarCV(id){const it=itens.find(x=>x.id===id),a=document.createElement('a');a.href=it.cv.data;a.download=it.cv.name;a.click()}
async function excluir(id){if(!confirm('Excluir esta entrevista e a ficha?'))return;await COL.doc(id).delete();fechar();toast('Excluída')}
function desenhar(){const L=$('#lista');if(!L)return;const lim=Date.now()-36e5;
  const prox=itens.filter(i=>new Date(i.ts)>=lim).sort((a,b)=>a.ts>b.ts?1:-1),ant=itens.filter(i=>new Date(i.ts)<lim).sort((a,b)=>a.ts<b.ts?1:-1);
  const card=(i,o)=>{const f=fmt(i.ts);return`<div class="cd ${o?'old':''}" onclick="detalhe('${i.id}')"><div class="n">Nº ${pad(i.n||0)}</div><h3>${esc(i.nome)}</h3>
    <p>Tel: <b>${esc(i.tel)}</b></p>${i.vaga?`<p class="m">${esc(i.vaga)}</p>`:''}<p class="m">Dia ${f.d} às ${f.t}</p><hr>
    <div class="lb">${o?'Entrevista':'Faltam'}</div><div class="big">${o?'Realizada':falta(i.ts)}</div><span class="tag ${i.ficha?'ok':''}">${i.ficha?'FICHA PREENCHIDA ✓':'AGUARDANDO FICHA'}</span></div>`};
  L.innerHTML=`<h2 class="sec">Próximas entrevistas</h2>${prox.length?`<div class="cards">${prox.map(i=>card(i)).join('')}</div>`:'<div class="empty">Nenhuma entrevista marcada.</div>'}
  ${ant.length?`<h2 class="sec">Anteriores</h2><div class="cards">${ant.map(i=>card(i,1)).join('')}</div>`:''}`}
$('#fm').addEventListener('submit',async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));
  const it={nome:v.nome.trim(),tel:v.tel.trim(),vaga:v.vaga.trim(),ts:v.data+'T'+v.hora,n:itens.reduce((m,i)=>Math.max(m,i.n||0),0)+1,criado:Date.now()};
  try{const r=await COL.add(it);e.target.reset();popupLink({...it,id:r.id},1)}catch(x){toast('Erro ao salvar')}});
function entrar(u){$('#login-screen').style.display='none';$('#app').style.display='block';$('#usuario-logado').textContent=u;
  COL.onSnapshot(s=>{itens=s.docs.map(d=>({id:d.id,...d.data()}));desenhar()});setInterval(desenhar,3e4)}
$('#form-login').addEventListener('submit',e=>{e.preventDefault();const u=$('#login-usuario').value.trim(),s=$('#login-senha').value;
  const ok=USUARIOS_REC.find(x=>x.usuario.toLowerCase()===u.toLowerCase()&&x.senha===s);
  if(!ok){$('#erro-login').style.display='block';return}sessionStorage.setItem('rec-usuario',ok.usuario);entrar(ok.usuario)});
$('#btn-sair').onclick=()=>{sessionStorage.removeItem('rec-usuario');location.reload()};

/* ===== Candidato (link ?c=ID) ===== */
async function candidato(){$('#cand').style.display='block';const M=$('#cand-main');M.innerHTML='<div class="card">Carregando…</div>';
  let it;try{const s=await COL.doc(cid).get();if(!s.exists)throw 0;it={id:cid,...s.data()}}catch(e){M.innerHTML='<div class="card">Não foi possível abrir este link. Peça um novo link à recrutadora.</div>';return}
  const f=fmt(it.ts),p=esc(it.nome.split(' ')[0]);
  if(it.ficha){M.innerHTML=`<div class="card"><h2>FICHA ENVIADA ✓</h2><p>Obrigado, ${p}! Sua entrevista continua marcada para <b>${f.d} às ${f.t}</b> — ${ENDERECO}.</p></div>`;return}
  M.innerHTML=`<div class="card" style="margin-bottom:14px;"><p style="margin:0;">Olá, <b>${p}</b>! Sua entrevista está marcada para o dia <b>${f.d}</b> às <b>${f.t}</b> no <b>${ENDERECO}</b>.</p><p class="hint" style="font-size:.85rem;">Para agilizar o atendimento, preencha a ficha abaixo antes de vir.</p></div>
  <form id="ff" class="card fg">${FICHA.map(([t,fs])=>`<div class="fs">${t}</div>${fs.map(campo).join('')}`).join('')}
  <div class="fs">Currículo (opcional)</div><div class="full"><input type="file" id="cv" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png"><div class="hint">Tamanho máximo: 500 KB.</div></div>
  <label class="full" style="display:flex;gap:8px;align-items:flex-start;text-transform:none;font-size:.82rem;"><input type="checkbox" required style="width:auto;margin-top:3px;"> Autorizo o uso destes dados somente para o processo seletivo (LGPD).</label>
  <div class="full"><button class="primary" style="width:100%;">Enviar ficha</button></div></form>`;
  $('#ff [name=nome]').value=it.nome;$('#ff [name=tel]').value=it.tel||'';
  $('#ff').onsubmit=async e=>{e.preventDefault();const up={ficha:Object.fromEntries(new FormData(e.target)),fichaEm:Date.now()},fl=$('#cv').files[0];delete up.ficha.undefined;
    if(fl){if(fl.size>512000){alert('O currículo passa de 500 KB. Envie um arquivo menor ou leve impresso.');return}
      up.cv={name:fl.name,data:await new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(fl)})}}
    try{await COL.doc(cid).update(up);candidato()}catch(x){alert('Não foi possível enviar. Avise a recrutadora.')}}}

/* ===== Início ===== */
if(cid)candidato();
else{const u=sessionStorage.getItem('rec-usuario');
  if(u&&USUARIOS_REC.some(x=>x.usuario===u))entrar(u);else $('#login-screen').style.display='block'}
</script>
</body>
</html>
